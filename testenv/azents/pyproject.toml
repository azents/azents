[project]
name = "azents-testenv"
version = "0.1.0"
description = "Azents local test environment tools (preflight, devserver lifecycle)"
requires-python = ">=3.14"
dependencies = [
    "cryptography==50.0.1",
    "filelock==3.32.4",
    "httpx==0.28.1",
    "mcp==2.1.1",
    "azents",
    "azents-admin-client",
    "azents-public-client",
    "pydantic==2.13.4",
    "python-dotenv==1.2.3",
    "python-frontmatter==1.3.0",
    "pyyaml==6.0.3",
    "typer==0.27.2",
    "websockets==15.0.1",
]

[project.scripts]
testenv = "testenv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["testenv"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "ty>=0.0.74",
]

[tool.ruff]
target-version = "py314"
line-length = 100
include = ["preflight.py", "devserver.py", "testenv/**/*.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "PLC", "PLE", "PLW", "PGH003"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["preflight.py", "devserver.py", "testenv"]

[tool.pytest.ini_options]
testpaths = ["testenv/tests"]

[tool.uv]
resolution = "lowest-direct"

[tool.uv.sources]
azents = { path = "../../python/apps/azents", editable = true }
azents-public-client = { path = "../../python/libs/azents-public-client", editable = true }
azents-admin-client = { path = "../../python/libs/azents-admin-client", editable = true }
