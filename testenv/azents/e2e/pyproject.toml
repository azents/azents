[project]
name = "azents-e2e"
version = "0.1.0"
description = "Azents E2E Tests"
requires-python = ">=3.14"
dependencies = [
    "requests==2.34.2",
    "websockets==16.1.1",
    "boto3==1.40.61",
    "types-boto3[s3]==1.43.83",
    "pytest==9.1.1",
    "testcontainers[postgres]==4.15.0",
    "docker==7.2.0",
    "cryptography==50.0.1",
    "python-on-whales==0.81.0",
    "selenium==4.47.0",
    "redis==8.1.0",
    # local dependencies
    "az-common",
    "azents-admin-client",
    "azents-public-client",
    "azents-runtime-control",
    # type stubs
    "types-requests==2.33.0.20260712",
    "types-docker==7.2.0.20260819",
]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
    "ty>=0.0.74",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
package = false
resolution = "lowest-direct"

[tool.uv.sources]
az-common = { path = "../../../python/libs/az-common", editable = true }
azents-admin-client = { path = "../../../python/libs/azents-admin-client", editable = true }
azents-public-client = { path = "../../../python/libs/azents-public-client", editable = true }
azents-runtime-control = { path = "../../../python/libs/azents-runtime-control", editable = true }

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "G", "PLC", "PLE", "PLW", "T", "PGH003"]

[tool.ty.environment]
python-version = "3.14"

[tool.pytest.ini_options]
testpaths = ["src/support_tests", "src/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
