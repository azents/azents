# Docker Compose stack for the local Azents test environment.
#
# Preflight and devserver commands use this file rather than the repository-level
# development stack. The services intentionally use disposable state.
#
# Usage:
#   docker compose -f testenv/azents/docker-compose.yaml up -d
#   docker compose -f testenv/azents/docker-compose.yaml down

name: azents-testenv

services:
  # No persistent volumes are declared so each recreated stack starts clean.

  db:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    ports:
      - "${AZENTS_TESTENV_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: azents
      POSTGRES_PASSWORD: azents
      POSTGRES_DB: azents

  valkey:
    image: valkey/valkey:9-alpine@sha256:de31910896150d5e754a07d57d227cfdde4e258ddd0d1aa4607f2d2f95843715
    restart: unless-stopped
    ports:
      - "${AZENTS_TESTENV_VALKEY_PORT:-6379}:6379"

  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.90@sha256:0725587f6fcca83c1898f321424327d6e6da5e01ea20382905dd258ed5af3be4
    restart: unless-stopped
    ports:
      - "${AZENTS_TESTENV_RUSTFS_PORT:-9000}:9000"
      - "${AZENTS_TESTENV_RUSTFS_CONSOLE_PORT:-9001}:9001"
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: "dummyaccess"
      RUSTFS_SECRET_KEY: "dummysecret"
      RUSTFS_VOLUMES: "/data"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  rustfs-init:
    image: minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set rustfs http://rustfs:9000 dummyaccess dummysecret;
      mc mb --ignore-existing rustfs/azents-dev;
      echo 'Bucket created successfully';
      "
