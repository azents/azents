syntax = "proto3";

package azents.runtime_control.v1;

import "google/protobuf/timestamp.proto";

service RuntimeStreamGatewaySession {
  rpc Connect(stream RuntimeStreamSessionEnvelope)
      returns (stream RuntimeStreamSessionEnvelope);
}

service RuntimeStreamControlSession {
  rpc Relay(stream RuntimeStreamSessionEnvelope)
      returns (stream RuntimeStreamSessionEnvelope);
}

service RuntimeRunnerStreamSession {
  rpc Connect(stream RuntimeStreamSessionEnvelope)
      returns (stream RuntimeStreamSessionEnvelope);
}

enum RuntimeStreamSessionPeerRole {
  RUNTIME_STREAM_SESSION_PEER_ROLE_UNSPECIFIED = 0;
  RUNTIME_STREAM_SESSION_PEER_ROLE_GATEWAY = 1;
  RUNTIME_STREAM_SESSION_PEER_ROLE_CONTROL = 2;
  RUNTIME_STREAM_SESSION_PEER_ROLE_RUNNER = 3;
}

enum RuntimeStreamSessionProtocol {
  RUNTIME_STREAM_SESSION_PROTOCOL_UNSPECIFIED = 0;
  RUNTIME_STREAM_SESSION_PROTOCOL_HTTP = 1;
  RUNTIME_STREAM_SESSION_PROTOCOL_WEBSOCKET = 2;
}

enum RuntimeStreamSessionDirection {
  RUNTIME_STREAM_SESSION_DIRECTION_UNSPECIFIED = 0;
  RUNTIME_STREAM_SESSION_DIRECTION_REQUEST = 1;
  RUNTIME_STREAM_SESSION_DIRECTION_RESPONSE = 2;
}

enum RuntimeStreamSessionRoutePath {
  RUNTIME_STREAM_SESSION_ROUTE_PATH_UNSPECIFIED = 0;
  RUNTIME_STREAM_SESSION_ROUTE_PATH_LOCAL = 1;
  RUNTIME_STREAM_SESSION_ROUTE_PATH_RELAY = 2;
}

enum RuntimeStreamSessionWebSocketOpcode {
  RUNTIME_STREAM_SESSION_WEBSOCKET_OPCODE_UNSPECIFIED = 0;
  RUNTIME_STREAM_SESSION_WEBSOCKET_OPCODE_TEXT = 1;
  RUNTIME_STREAM_SESSION_WEBSOCKET_OPCODE_BINARY = 2;
  RUNTIME_STREAM_SESSION_WEBSOCKET_OPCODE_CONTINUATION = 3;
  RUNTIME_STREAM_SESSION_WEBSOCKET_OPCODE_PING = 4;
  RUNTIME_STREAM_SESSION_WEBSOCKET_OPCODE_PONG = 5;
  RUNTIME_STREAM_SESSION_WEBSOCKET_OPCODE_CLOSE = 6;
}

enum RuntimeStreamSessionCloseReason {
  RUNTIME_STREAM_SESSION_CLOSE_REASON_UNSPECIFIED = 0;
  RUNTIME_STREAM_SESSION_CLOSE_REASON_CALLER = 1;
  RUNTIME_STREAM_SESSION_CLOSE_REASON_SERVICE_EXPIRED = 2;
  RUNTIME_STREAM_SESSION_CLOSE_REASON_AUTHORITY_REVOKED = 3;
  RUNTIME_STREAM_SESSION_CLOSE_REASON_GENERATION_REPLACED = 4;
  RUNTIME_STREAM_SESSION_CLOSE_REASON_DEADLINE = 5;
  RUNTIME_STREAM_SESSION_CLOSE_REASON_SERVICE_DRAIN = 6;
  RUNTIME_STREAM_SESSION_CLOSE_REASON_OWNER_LOST = 7;
  RUNTIME_STREAM_SESSION_CLOSE_REASON_PROTOCOL_VIOLATION = 8;
  RUNTIME_STREAM_SESSION_CLOSE_REASON_RESOURCE_EXHAUSTED = 9;
  RUNTIME_STREAM_SESSION_CLOSE_REASON_APPLICATION_UNAVAILABLE = 10;
  RUNTIME_STREAM_SESSION_CLOSE_REASON_TRANSPORT_UNAVAILABLE = 11;
}

message RuntimeStreamSessionEnvelope {
  string protocol_fingerprint = 1;
  string session_id = 2;
  string peer_boot_id = 3;
  optional string owner_boot_id = 4;
  optional string session_lease_id = 5;
  optional uint64 lease_generation = 6;
  uint64 stream_id = 7;
  uint64 frame_sequence = 8;

  oneof payload {
    RuntimeStreamSessionHello hello = 20;
    RuntimeStreamSessionAccepted session_accepted = 21;
    RuntimeStreamSessionHeartbeat heartbeat = 22;
    RuntimeStreamSessionHeartbeatAcknowledgement heartbeat_ack = 23;
    RuntimeStreamSessionGoAway go_away = 24;
    RuntimeStreamSessionError session_error = 25;
    RuntimeStreamSessionOpen open = 30;
    RuntimeStreamSessionOpenAccepted open_accepted = 31;
    RuntimeStreamSessionOpenRejected open_rejected = 32;
    RuntimeStreamSessionResponseHead response_head = 33;
    RuntimeStreamSessionData data = 34;
    RuntimeStreamSessionWindowUpdate window_update = 35;
    RuntimeStreamSessionDirectionEnd direction_end = 36;
    RuntimeStreamSessionWebSocketFrame websocket = 37;
    RuntimeStreamSessionCancel cancel = 38;
    RuntimeStreamSessionReset reset = 39;
    RuntimeStreamSessionStreamEnd stream_end = 40;
  }
}

message RuntimeStreamSessionHello {
  RuntimeStreamSessionPeerRole role = 1;
  optional string runtime_id = 2;
  optional uint64 desired_generation = 3;
  optional uint64 runner_generation = 4;
  string session_nonce = 5;
  uint32 maximum_data_frame_bytes = 6;
  uint64 request_stream_window_bytes = 7;
  uint64 response_stream_window_bytes = 8;
  uint64 request_session_window_bytes = 9;
  uint64 response_session_window_bytes = 10;
  google.protobuf.Timestamp deadline_at = 11;
}

message RuntimeStreamSessionAccepted {
  uint32 data_frame_bytes = 1;
  uint64 request_stream_window_bytes = 2;
  uint64 response_stream_window_bytes = 3;
  uint64 request_session_window_bytes = 4;
  uint64 response_session_window_bytes = 5;
  google.protobuf.Timestamp accepted_at = 6;
}

message RuntimeStreamSessionHeartbeat {
  uint64 monotonic_sequence = 1;
}

message RuntimeStreamSessionHeartbeatAcknowledgement {
  uint64 monotonic_sequence = 1;
}

message RuntimeStreamSessionGoAway {
  uint64 last_accepted_stream_id = 1;
  RuntimeStreamSessionCloseReason reason = 2;
  google.protobuf.Timestamp drain_deadline_at = 3;
}

message RuntimeStreamSessionError {
  RuntimeStreamSessionCloseReason reason = 1;
}

message RuntimeStreamSessionHeader {
  bytes name = 1;
  bytes value = 2;
}

message RuntimeStreamSessionAuthority {
  string correlation_id = 1;
  string service_id = 2;
  uint64 service_revision = 3;
  string identity_id = 4;
  string authentication_session_id = 5;
  string user_id = 6;
  string agent_id = 7;
  string runtime_id = 8;
  uint64 desired_generation = 9;
  uint64 runner_generation = 10;
  uint32 port = 11;
  google.protobuf.Timestamp exposure_deadline_at = 12;
  google.protobuf.Timestamp transport_deadline_at = 13;
  google.protobuf.Timestamp open_deadline_at = 14;
}

message RuntimeStreamSessionRequestHead {
  RuntimeStreamSessionProtocol protocol = 1;
  bytes method = 2;
  bytes target = 3;
  repeated RuntimeStreamSessionHeader headers = 4;
}

message RuntimeStreamSessionOpen {
  RuntimeStreamSessionAuthority authority = 1;
  RuntimeStreamSessionRequestHead request_head = 2;
}

message RuntimeStreamSessionOpenAccepted {
  uint32 data_frame_bytes = 1;
  uint64 request_credit_bytes = 2;
  uint64 response_credit_bytes = 3;
  RuntimeStreamSessionRoutePath route_path = 4;
}

message RuntimeStreamSessionOpenRejected {
  RuntimeStreamSessionCloseReason reason = 1;
}

message RuntimeStreamSessionResponseHead {
  uint32 status = 1;
  repeated RuntimeStreamSessionHeader headers = 2;
}

message RuntimeStreamSessionData {
  RuntimeStreamSessionDirection direction = 1;
  bytes data = 2;
}

message RuntimeStreamSessionWindowUpdate {
  RuntimeStreamSessionDirection direction = 1;
  uint64 stream_consumed_total = 2;
  uint64 session_consumed_total = 3;
}

message RuntimeStreamSessionDirectionEnd {
  RuntimeStreamSessionDirection direction = 1;
  uint64 final_sequence = 2;
}

message RuntimeStreamSessionWebSocketFrame {
  RuntimeStreamSessionDirection direction = 1;
  RuntimeStreamSessionWebSocketOpcode opcode = 2;
  bool final = 3;
  bytes data = 4;
}

message RuntimeStreamSessionCancel {
  RuntimeStreamSessionCloseReason reason = 1;
}

message RuntimeStreamSessionReset {
  RuntimeStreamSessionCloseReason reason = 1;
}

message RuntimeStreamSessionStreamEnd {}
