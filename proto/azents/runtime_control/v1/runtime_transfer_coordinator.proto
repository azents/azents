syntax = "proto3";

package azents.runtime_control.v1;

import "google/protobuf/timestamp.proto";

service RuntimeTransferCoordinator {
  rpc AdmitTransfer(AdmitTransferRequest) returns (AdmitTransferResponse);
  rpc MarkTransferReady(MarkTransferReadyRequest)
      returns (TransferStatusResponse);
  rpc DispatchTransfer(DispatchTransferRequest)
      returns (TransferStatusResponse);
  rpc CancelTransfer(CancelTransferRequest) returns (TransferStatusResponse);
  rpc GetVerifiedObject(GetVerifiedObjectRequest)
      returns (GetVerifiedObjectResponse);
  rpc ClaimConsumer(ClaimConsumerRequest) returns (TransferStatusResponse);
  rpc RenewConsumerLease(RenewConsumerLeaseRequest)
      returns (TransferStatusResponse);
  rpc AcknowledgeConsumer(AcknowledgeConsumerRequest)
      returns (TransferStatusResponse);
  rpc AbandonConsumer(AbandonConsumerRequest)
      returns (TransferStatusResponse);
  rpc SettleTransfer(SettleTransferRequest) returns (TransferStatusResponse);
  rpc RecordCleanup(RecordCleanupRequest) returns (TransferStatusResponse);
  rpc RegisterPreparationCleanup(RegisterPreparationCleanupRequest)
      returns (TransferStatusResponse);
  rpc PromotePreparationCleanup(PromotePreparationCleanupRequest)
      returns (TransferStatusResponse);
  rpc ClearPreparationCleanup(ClearPreparationCleanupRequest)
      returns (TransferStatusResponse);
  rpc GetTransferStatus(GetTransferStatusRequest)
      returns (TransferStatusResponse);
}

service RuntimeWorkspaceUploadCoordinator {
  rpc CreateWorkspaceUpload(CreateWorkspaceUploadRequest)
      returns (WorkspaceUploadStatusResponse);
  rpc IssueWorkspaceUploadTicket(IssueWorkspaceUploadTicketRequest)
      returns (WorkspaceUploadTicketResponse);
  rpc FinalizeWorkspaceUpload(FinalizeWorkspaceUploadRequest)
      returns (WorkspaceUploadStatusResponse);
  rpc GetWorkspaceUpload(GetWorkspaceUploadRequest)
      returns (WorkspaceUploadStatusResponse);
  rpc CancelWorkspaceUpload(CancelWorkspaceUploadRequest)
      returns (WorkspaceUploadStatusResponse);
  rpc RetryWorkspaceUpload(RetryWorkspaceUploadRequest)
      returns (WorkspaceUploadStatusResponse);
}

enum CoordinatorTransferDirection {
  COORDINATOR_TRANSFER_DIRECTION_UNSPECIFIED = 0;
  COORDINATOR_TRANSFER_DIRECTION_DOWNLOAD = 1;
  COORDINATOR_TRANSFER_DIRECTION_UPLOAD = 2;
}

enum CoordinatorTransferPhase {
  COORDINATOR_TRANSFER_PHASE_UNSPECIFIED = 0;
  COORDINATOR_TRANSFER_PHASE_PREPARING = 1;
  COORDINATOR_TRANSFER_PHASE_READY = 2;
  COORDINATOR_TRANSFER_PHASE_STREAMING = 3;
  COORDINATOR_TRANSFER_PHASE_VERIFYING = 4;
  COORDINATOR_TRANSFER_PHASE_AVAILABLE = 5;
  COORDINATOR_TRANSFER_PHASE_CONSUMING = 6;
  COORDINATOR_TRANSFER_PHASE_CONSUMED = 7;
  COORDINATOR_TRANSFER_PHASE_COMMITTED = 8;
  COORDINATOR_TRANSFER_PHASE_TERMINAL = 9;
}

enum CoordinatorTransferOutcome {
  COORDINATOR_TRANSFER_OUTCOME_UNSPECIFIED = 0;
  COORDINATOR_TRANSFER_OUTCOME_SUCCEEDED = 1;
  COORDINATOR_TRANSFER_OUTCOME_FAILED = 2;
  COORDINATOR_TRANSFER_OUTCOME_CANCELLED = 3;
  COORDINATOR_TRANSFER_OUTCOME_EXPIRED = 4;
  COORDINATOR_TRANSFER_OUTCOME_SUPERSEDED = 5;
}

enum CoordinatorTransferFailure {
  COORDINATOR_TRANSFER_FAILURE_UNSPECIFIED = 0;
  COORDINATOR_TRANSFER_FAILURE_ADMISSION = 1;
  COORDINATOR_TRANSFER_FAILURE_CANCELLED = 2;
  COORDINATOR_TRANSFER_FAILURE_EXPIRED = 3;
  COORDINATOR_TRANSFER_FAILURE_FENCED = 4;
  COORDINATOR_TRANSFER_FAILURE_INTEGRITY = 5;
  COORDINATOR_TRANSFER_FAILURE_STREAM = 6;
  COORDINATOR_TRANSFER_FAILURE_CONSUMER = 7;
  COORDINATOR_TRANSFER_FAILURE_DESTINATION_CONFLICT = 8;
}

enum CoordinatorCleanupStatus {
  COORDINATOR_CLEANUP_STATUS_UNSPECIFIED = 0;
  COORDINATOR_CLEANUP_STATUS_NOT_REQUIRED = 1;
  COORDINATOR_CLEANUP_STATUS_PENDING = 2;
  COORDINATOR_CLEANUP_STATUS_COMPLETE = 3;
  COORDINATOR_CLEANUP_STATUS_RETRYABLE_FAILURE = 4;
}

enum CoordinatorPreparationCleanupState {
  COORDINATOR_PREPARATION_CLEANUP_STATE_UNSPECIFIED = 0;
  COORDINATOR_PREPARATION_CLEANUP_STATE_NOT_REQUIRED = 1;
  COORDINATOR_PREPARATION_CLEANUP_STATE_MULTIPART_PENDING = 2;
  COORDINATOR_PREPARATION_CLEANUP_STATE_COMPLETED_OBJECT_PENDING = 3;
}

enum CoordinatorCancellationReason {
  COORDINATOR_CANCELLATION_REASON_UNSPECIFIED = 0;
  COORDINATOR_CANCELLATION_REASON_CALLER = 1;
  COORDINATOR_CANCELLATION_REASON_DEADLINE = 2;
  COORDINATOR_CANCELLATION_REASON_SUPERSEDED = 3;
  COORDINATOR_CANCELLATION_REASON_SHUTDOWN = 4;
}

enum CoordinatorDispatchStatus {
  COORDINATOR_DISPATCH_STATUS_UNSPECIFIED = 0;
  COORDINATOR_DISPATCH_STATUS_NOT_BOUND = 1;
  COORDINATOR_DISPATCH_STATUS_BOUND = 2;
  COORDINATOR_DISPATCH_STATUS_DELIVERABLE = 3;
  COORDINATOR_DISPATCH_STATUS_ENQUEUED = 4;
}

enum WorkspaceUploadPhase {
  WORKSPACE_UPLOAD_PHASE_UNSPECIFIED = 0;
  WORKSPACE_UPLOAD_PHASE_QUEUED = 1;
  WORKSPACE_UPLOAD_PHASE_UPLOADING = 2;
  WORKSPACE_UPLOAD_PHASE_MOVING_TO_RUNTIME = 3;
  WORKSPACE_UPLOAD_PHASE_CONFLICTED = 4;
  WORKSPACE_UPLOAD_PHASE_RETRYABLE_FAILURE = 5;
  WORKSPACE_UPLOAD_PHASE_SUCCEEDED = 6;
  WORKSPACE_UPLOAD_PHASE_CANCELLED = 7;
  WORKSPACE_UPLOAD_PHASE_FAILED = 8;
  WORKSPACE_UPLOAD_PHASE_EXPIRED = 9;
}

enum WorkspaceUploadFailure {
  WORKSPACE_UPLOAD_FAILURE_UNSPECIFIED = 0;
  WORKSPACE_UPLOAD_FAILURE_INVALID_REQUEST = 1;
  WORKSPACE_UPLOAD_FAILURE_AUTHORIZATION = 2;
  WORKSPACE_UPLOAD_FAILURE_TOO_LARGE = 3;
  WORKSPACE_UPLOAD_FAILURE_REVISION_CONFLICT = 4;
  WORKSPACE_UPLOAD_FAILURE_DESTINATION_CONFLICT = 5;
  WORKSPACE_UPLOAD_FAILURE_RUNTIME_UNAVAILABLE = 6;
  WORKSPACE_UPLOAD_FAILURE_FENCED = 7;
  WORKSPACE_UPLOAD_FAILURE_INTEGRITY = 8;
  WORKSPACE_UPLOAD_FAILURE_TRANSFER = 9;
  WORKSPACE_UPLOAD_FAILURE_CANCELLED = 10;
  WORKSPACE_UPLOAD_FAILURE_EXPIRED = 11;
}

message CoordinatorTransferIdentity {
  string transfer_id = 1;
  string attempt_id = 2;
  string runtime_id = 3;
  uint64 desired_generation = 4;
  CoordinatorTransferDirection direction = 5;
  string operation_id = 6;
  optional string session_id = 7;
  optional string agent_id = 8;
}

message ExpectedManifest {
  optional uint64 size = 1;
  optional string sha256 = 2;
}

message ObjectManifest {
  optional uint64 size = 1;
  optional string sha256 = 2;
}

message OpaqueObjectHandle {
  string value = 1;
}

message CoordinatorTransferStatus {
  CoordinatorTransferIdentity identity = 1;
  CoordinatorTransferPhase phase = 2;
  uint64 revision = 3;
  optional uint64 accepted_runner_generation = 4;
  optional string dispatch_id = 5;
  CoordinatorDispatchStatus dispatch_status = 6;
  ExpectedManifest expected_manifest = 7;
  ObjectManifest actual_manifest = 8;
  google.protobuf.Timestamp deadline_at = 9;
  google.protobuf.Timestamp logical_expires_at = 10;
  CoordinatorTransferOutcome outcome = 11;
  CoordinatorTransferFailure failure = 12;
  CoordinatorCleanupStatus cleanup_status = 13;
  bool cancellation_requested = 14;
  CoordinatorPreparationCleanupState preparation_cleanup_state = 15;
  optional DestinationEvidence destination_conflict = 16;
}

message AdmitTransferRequest {
  CoordinatorTransferIdentity identity = 1;
  string lease_id = 2;
  string runtime_path = 3;
  optional bool overwrite = 4;
  ExpectedManifest expected_manifest = 5;
  optional uint64 product_maximum_size = 6;
  optional uint64 provider_maximum_size = 7;
  google.protobuf.Timestamp deadline_at = 8;
  google.protobuf.Timestamp source_expires_at = 9;
  string resource_class = 10;
  optional bytes conflict_precondition = 11;
}

message AdmitTransferResponse {
  CoordinatorTransferStatus status = 1;
  OpaqueObjectHandle admitted_object_handle = 2;
}

message MarkTransferReadyRequest {
  CoordinatorTransferIdentity identity = 1;
  uint64 expected_revision = 2;
  OpaqueObjectHandle object_handle = 3;
  ObjectManifest object_manifest = 4;
}

message DispatchTransferRequest {
  CoordinatorTransferIdentity identity = 1;
  uint64 expected_revision = 2;
  string dispatch_id = 3;
}

message CancelTransferRequest {
  CoordinatorTransferIdentity identity = 1;
  uint64 expected_revision = 2;
  CoordinatorCancellationReason reason = 3;
}

message GetVerifiedObjectRequest {
  CoordinatorTransferIdentity identity = 1;
  uint64 expected_revision = 2;
  string consumer_claim_id = 3;
}

message GetVerifiedObjectResponse {
  CoordinatorTransferStatus status = 1;
  OpaqueObjectHandle verified_object_handle = 2;
  ObjectManifest actual_manifest = 3;
}

message ClaimConsumerRequest {
  CoordinatorTransferIdentity identity = 1;
  uint64 expected_revision = 2;
  string consumer_claim_id = 3;
}

message RenewConsumerLeaseRequest {
  CoordinatorTransferIdentity identity = 1;
  uint64 expected_revision = 2;
  string consumer_claim_id = 3;
}

message AcknowledgeConsumerRequest {
  CoordinatorTransferIdentity identity = 1;
  uint64 expected_revision = 2;
  string consumer_claim_id = 3;
}

message AbandonConsumerRequest {
  CoordinatorTransferIdentity identity = 1;
  uint64 expected_revision = 2;
  string consumer_claim_id = 3;
}

message SettleTransferRequest {
  CoordinatorTransferIdentity identity = 1;
  uint64 expected_revision = 2;
  CoordinatorTransferOutcome outcome = 3;
  oneof failure_choice {
    CoordinatorTransferFailure failure = 4;
    bool no_failure = 5;
  }
}

message RecordCleanupRequest {
  CoordinatorTransferIdentity identity = 1;
  uint64 expected_revision = 2;
  CoordinatorCleanupStatus cleanup_status = 3;
}

message RegisterPreparationCleanupRequest {
  CoordinatorTransferIdentity identity = 1;
  uint64 expected_revision = 2;
  OpaqueObjectHandle preparation_object_handle = 3;
  OpaqueObjectHandle multipart_cleanup_handle = 4;
}

message PromotePreparationCleanupRequest {
  CoordinatorTransferIdentity identity = 1;
  uint64 expected_revision = 2;
  OpaqueObjectHandle preparation_object_handle = 3;
}

message ClearPreparationCleanupRequest {
  CoordinatorTransferIdentity identity = 1;
  uint64 expected_revision = 2;
}

message GetTransferStatusRequest {
  CoordinatorTransferIdentity identity = 1;
}

message TransferStatusResponse {
  CoordinatorTransferStatus status = 1;
}

message WorkspaceUploadIdentity {
  string upload_id = 1;
  string requester_user_id = 2;
  string workspace_id = 3;
  string agent_id = 4;
  string runtime_id = 5;
  uint64 desired_generation = 6;
  optional string session_id = 7;
}

message DestinationEvidence {
  string kind = 1;
  optional uint64 size = 2;
  google.protobuf.Timestamp modified_at = 3;
  optional bytes conflict_precondition = 4;
}

message WorkspaceUploadStatus {
  WorkspaceUploadIdentity identity = 1;
  uint64 revision = 2;
  string destination_directory = 3;
  string filename = 4;
  string destination_path = 5;
  uint64 expected_size = 6;
  uint64 received_size = 7;
  optional uint64 actual_size = 8;
  optional string sha256 = 9;
  optional string media_type = 10;
  reserved 11;
  WorkspaceUploadPhase phase = 12;
  uint64 current_delivery_number = 13;
  optional CoordinatorTransferOutcome outcome = 14;
  optional WorkspaceUploadFailure failure = 15;
  bool retry_available = 16;
  bool cancel_available = 17;
  bool overwrite_available = 18;
  optional DestinationEvidence destination_evidence = 19;
}

message CreateWorkspaceUploadRequest {
  WorkspaceUploadIdentity identity = 1;
  string destination_directory = 2;
  string filename = 3;
  string destination_path = 4;
  uint64 expected_size = 5;
  optional string media_type = 6;
  google.protobuf.Timestamp deadline_at = 7;
  string expected_sha256 = 8;
}

message WorkspaceUploadHeader {
  string name = 1;
  string value = 2;
}

message WorkspaceUploadTicket {
  string method = 1;
  string url = 2;
  google.protobuf.Timestamp expires_at = 3;
  repeated WorkspaceUploadHeader headers = 4;
}

message IssueWorkspaceUploadTicketRequest {
  WorkspaceUploadIdentity identity = 1;
  uint64 expected_revision = 2;
}

message WorkspaceUploadTicketResponse {
  WorkspaceUploadStatus status = 1;
  WorkspaceUploadTicket ticket = 2;
}

message FinalizeWorkspaceUploadRequest {
  WorkspaceUploadIdentity identity = 1;
  uint64 expected_revision = 2;
}

message GetWorkspaceUploadRequest {
  WorkspaceUploadIdentity identity = 1;
}

message CancelWorkspaceUploadRequest {
  WorkspaceUploadIdentity identity = 1;
  uint64 expected_revision = 2;
  uint64 current_delivery_number = 3;
}

message RetryWorkspaceUploadRequest {
  WorkspaceUploadIdentity identity = 1;
  uint64 expected_revision = 2;
  uint64 current_delivery_number = 3;
  bool overwrite = 4;
  optional bytes conflict_precondition = 5;
}

message WorkspaceUploadStatusResponse {
  WorkspaceUploadStatus status = 1;
}
