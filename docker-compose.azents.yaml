name: azents
services:
  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    ports:
      - "${AZENTS_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_USER: azents
      POSTGRES_PASSWORD: azents
      POSTGRES_DB: azents
  valkey:
    image: valkey/valkey:9-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${AZENTS_VALKEY_PORT:-6379}:6379"
  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.90@sha256:0725587f6fcca83c1898f321424327d6e6da5e01ea20382905dd258ed5af3be4
    restart: unless-stopped
    ports:
      # API
      - "${AZENTS_RUSTFS_PORT:-9000}:9000"
      # Console
      - "${AZENTS_RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs:/data
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: "dummy"
      RUSTFS_SECRET_KEY: "dummy"
      RUSTFS_VOLUMES: "/data"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
  rustfs-init:
    image: minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set rustfs http://rustfs:9000 dummy dummy;
      mc mb --ignore-existing rustfs/azents-dev;
      echo 'Bucket created successfully';
      "
volumes:
  pgdata:
  rustfs:

networks:
  # Dedicated bridge network for Agent Home containers
  # DockerAgentHomeClient connects containers to this network
  sandbox-restricted:
    driver: bridge
