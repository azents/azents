[project]
name = "azents-runtime-provider-kubernetes"
version = "0.3.0"
description = "Azents Agent Runtime Kubernetes Provider"
requires-python = ">=3.14"
dependencies = [
    "aiohttp==3.14.3",
    "azents-runtime-control",
    "cryptography==50.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
    "ty>=0.0.74",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
package = true
resolution = "lowest-direct"

[tool.uv.build-backend]
module-name = "azents_runtime_provider_kubernetes"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
azents-runtime-control = { path = "../../libs/azents-runtime-control", editable = true }

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "G", "PLC", "PLE", "PLW", "ANN", "T", "PGH003"]

[tool.ty.environment]
python-version = "3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
