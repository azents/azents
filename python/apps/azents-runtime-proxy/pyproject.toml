[project]
name = "azents-runtime-proxy"
version = "0.1.0"
description = "Azents inspected Runtime forward proxy"
requires-python = ">=3.14"
dependencies = [
    "cryptography==48.0.1",
    "mitmproxy==12.2.3",
]

[project.scripts]
azents-runtime-proxy = "azents_runtime_proxy.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
    "ty>=0.0.74",
]

[tool.uv]
package = true
resolution = "lowest-direct"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "G", "PLC", "PLE", "PLW", "ANN", "T", "PGH003"]

[tool.ty.environment]
python-version = "3.14"
