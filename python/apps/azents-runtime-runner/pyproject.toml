[project]
name = "azents-runtime-runner"
version = "0.1.0"
description = "Azents Agent Runtime Runner"
requires-python = ">=3.14"
dependencies = [
    "aiohttp==3.14.5",
    "azents-runtime-control",
    "camoufox==0.5.8",
    "h11==0.16.0",
    "httpcore[asyncio]==1.0.9",
    "markdownify==1.2.3",
    "patchright==1.64.1",
    "pynacl==1.6.2",
    "wsproto==1.3.2",
]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
    "ty>=0.0.74",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pillow>=12.3.0",
]

[tool.uv]
package = true
resolution = "lowest-direct"

[tool.uv.build-backend]
module-name = "azents_runtime_runner"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
azents-runtime-control = { path = "../../libs/azents-runtime-control", editable = true }

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "G", "PLC", "PLE", "PLW", "ANN", "T", "PGH003"]

[tool.ty.environment]
python-version = "3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
