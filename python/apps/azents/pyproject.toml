[project]
name = "azents"
version = "0.1.0"
description = "Azents Server"
requires-python = ">=3.14"
dependencies = [
    # FastAPI & Web
    "fastapi[standard]==0.141.1",
    "uvicorn==0.52.4",
    # Database
    "sqlalchemy[asyncio]==2.0.52",
    "psycopg[binary]==3.3.6",
    "alembic==1.19.2",
    "alembic-postgresql-enum==1.10.0",
    # Configuration
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    # AWS
    "boto3==1.40.61",
    "aioboto3==15.5.0",
    # Auth & Security
    "bcrypt==5.0.0",
    "pyjwt==2.15.1",
    "cryptography==50.0.2",
    # Supported GitHub API and OAuth operations
    "githubkit[auth-app]==0.16.1",
    # Utilities
    "pytz==2026.3.post1",
    "tzdata==2026.3",
    "python-dateutil==2.9.0.post0",
    "idna==3.20",
    # Monitoring
    "sentry-sdk[fastapi]==2.68.1",
    # CLI
    "typer==0.27.3",
    # Template rendering
    "jinja2==3.1.6",
    # Type stubs
    "types-pytz==2026.3.1.20260727",
    "types-aioboto3[aioboto3,s3,ses]==15.5.0",
    "boto3-stubs[rds]==1.43.115",
    # Docker API client
    "aiodocker==0.27.0",
    # Kubernetes clients: lightkube for standard operations and
    # kubernetes_asyncio for exec WebSocket support
    "kubernetes-asyncio==36.1.0",
    "lightkube==1.0.1",
    "httpx2==2.12.0",
    # Local dependencies
    "az-common",
    # Model transports
    "pydantic-ai-slim[anthropic,google,openai]==2.59.0",
    "openai[realtime]==3.26.0",
    "openrouter==0.10.8",
    "anthropic==1.12.1",
    "google-genai==2.30.0",
    "Pillow==13.0.0",
    "redis==8.1.0",
    "mcp==2.2.0",
    "httpx==0.28.1",
    "ptpython==3.0.32",
    "aiohttp==3.14.5",
    "python-frontmatter==1.3.0",
    "google-auth==2.57.1",
    # Supported direct Google Workspace API SDK and authorization transport
    "google-api-python-client==2.201.0",
    "google-auth-httplib2==0.4.4",
    "httplib2==0.32.0",
    "croniter==6.2.4",
    "google-analytics-data==0.23.3",
    "google-analytics-admin==0.30.2",
    "google-cloud-container==2.67.0",
    "grpcio==1.83.1",
    "azents-runtime-control",
    "websockets==15.0.1",
    "discord-py==2.7.1",
    "slack-sdk==3.44.1",
    "authlib==1.9.1",
    # Bounded document conversion and extraction (no OCR or macro execution)
    "markdown-it-py==4.2.0",
    "defusedxml==0.7.1",
    "pypdf==6.21.2",
]

[project.scripts]
team_session_cutover = "azents.cli.team_session_cutover:app"
external_channel_ingress = "azents.cli.external_channel_ingress:app"

[dependency-groups]
dev = [
    "ruff>=0.16.4",
    "ty>=0.0.74",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "testcontainers[postgres,redis]>=4.15.0",
    "types-croniter>=6.0.0",
    "pytest-alembic>=0.12.1",
    "pynacl>=1.6.2",
    "pytest-xdist>=3.8.0",
    "google-api-python-client-stubs>=1.40.0",
    "types-python-dateutil>=2.9.0.20261021",
]

[tool.uv]
package = true
resolution = "lowest-direct"

[tool.uv.build-backend]
module-name = "azents"

[build-system]
requires = ["uv_build>=0.9.10"]
build-backend = "uv_build"

[tool.uv.sources]
az-common = { path = "../../libs/az-common", editable = true }
azents-runtime-control = { path = "../../libs/azents-runtime-control", editable = true }

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "G", "PLC", "PLE", "PLW", "ANN", "T", "PGH003"]

[tool.ruff.lint.per-file-ignores]
"typings/**/*.pyi" = ["ANN401"]  # Stubs may use Any when external types are unavailable.

[tool.ty.environment]
python-version = "3.14"
extra-paths = ["typings/botocore-public"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["src"]
