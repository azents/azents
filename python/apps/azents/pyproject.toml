[project]
name = "azents"
version = "0.1.0"
description = "Azents Server"
requires-python = ">=3.14"
dependencies = [
    # FastAPI & Web
    "fastapi[standard]==0.141.1",
    "uvicorn==0.52.3",
    # Database
    "sqlalchemy[asyncio]==2.0.52",
    "psycopg[binary]==3.3.4",
    "alembic==1.19.1",
    "alembic-postgresql-enum==1.10.0",
    # Configuration
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    # AWS
    "boto3==1.40.61",
    "aioboto3==15.5.0",
    # Auth & Security
    "bcrypt==5.0.0",
    "pyjwt==2.13.0",
    "cryptography==50.0.0",
    # Utilities
    "pytz==2026.3.post1",
    "tzdata==2026.3",
    # Monitoring
    "sentry-sdk[fastapi]==2.68.0",
    # CLI
    "typer==0.27.1",
    # Template rendering
    "jinja2==3.1.6",
    # Type stubs
    "types-pytz==2026.3.1.20260727",
    "types-aioboto3[aioboto3,s3,ses]==15.5.0",
    "boto3-stubs[rds]==1.43.75",
    # Docker API client
    "aiodocker==0.27.0",
    # Kubernetes clients: lightkube for standard operations and
    # kubernetes_asyncio for exec WebSocket support
    "kubernetes-asyncio==36.1.0",
    "lightkube==0.22.0",
    # Local dependencies
    "az-common",
    "litellm==1.91.3",
    "openai[realtime]==2.54.0",
    "Pillow==12.3.0",
    "redis==7.4.1",
    "mcp==1.29.0",
    "httpx==0.28.1",
    "ptpython==3.0.32",
    "aiohttp==3.14.3",
    "python-frontmatter==1.3.0",
    "google-auth==2.57.0",
    "croniter==6.2.4",
    "google-analytics-data==0.23.0",
    "google-analytics-admin==0.30.1",
    "grpcio==1.83.0",
    "azents-runtime-control",
    "websockets==15.0.1",
    "discord-py==2.7.1",
    "slack-sdk==3.43.0",
]

[project.scripts]
team_session_cutover = "azents.cli.team_session_cutover:app"
external_channel_ingress = "azents.cli.external_channel_ingress:app"

[dependency-groups]
dev = [
    "ruff>=0.16.4",
    "ty>=0.0.74",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "testcontainers[postgres,redis]>=4.15.0",
    "types-croniter>=6.0.0",
    "pytest-alembic>=0.12.1",
]

[tool.uv]
package = true
resolution = "lowest-direct"

[tool.uv.build-backend]
module-name = "azents"

[build-system]
requires = ["uv_build>=0.9.10"]
build-backend = "uv_build"

[tool.uv.sources]
az-common = { path = "../../libs/az-common", editable = true }
azents-runtime-control = { path = "../../libs/azents-runtime-control", editable = true }

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "G", "PLC", "PLE", "PLW", "ANN", "T", "PGH003"]

[tool.ruff.lint.per-file-ignores]
"typings/**/*.pyi" = ["ANN401"]  # Stubs may use Any when external types are unavailable.

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
exclude = [
    # Immutable historical migration imports the enum member that this revision removes.
    "db-schemas/rdb/migrations/versions/8bbe580fddad_evolve_input_buffers_into_mailbox_items.py",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["src"]
