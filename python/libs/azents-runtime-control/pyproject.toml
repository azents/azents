[project]
name = "azents-runtime-control"
version = "0.1.0"
description = "Shared Agent Runtime Control contracts"
requires-python = ">=3.14"
dependencies = [
    "grpcio>=1.83.0",
    "protobuf>=7.35.1",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.83.0",
    "ruff>=0.16.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "mypy-protobuf>=5.1.0",
    "types-protobuf>=7.34.1.20260518",
    "types-grpcio>=1.83.0.20260730",
    "ty>=0.0.74",
]

[tool.uv]
package = true
resolution = "lowest-direct"

[tool.uv.build-backend]
module-name = "azents_runtime_control"

[build-system]
requires = ["uv_build>=0.9.10,<0.12"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "G", "PLC", "PLE", "PLW", "ANN", "T", "PGH003"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
exclude = ["src/azents_runtime_control/proto"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
