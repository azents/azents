name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0 or v0.2.0-rc.1"
        required: true
        type: string
      channel:
        description: "Release channel"
        required: true
        type: choice
        options:
          - stable
          - prerelease

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: azents

jobs:
  validate:
    name: validate-release
    runs-on: ubuntu-latest
    environment: release
    outputs:
      version: ${{ steps.validate.outputs.version }}
      chart_version: ${{ steps.validate.outputs.chart_version }}
      major: ${{ steps.validate.outputs.major }}
      minor: ${{ steps.validate.outputs.minor }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate version, channel, and source
        id: validate
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo "Releases must run from the main branch; got $GITHUB_REF" >&2
            exit 1
          fi
          semver_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          if [[ ! "$VERSION" =~ $semver_pattern ]]; then
            echo "Invalid SemVer tag: $VERSION" >&2
            exit 1
          fi
          prerelease=false
          if [[ "$VERSION" == *-* ]]; then
            prerelease=true
          fi
          if [ "$CHANNEL" = 'stable' ] && [ "$prerelease" = 'true' ]; then
            echo 'Stable releases must not use prerelease versions.' >&2
            exit 1
          fi
          if [ "$CHANNEL" = 'prerelease' ] && [ "$prerelease" != 'true' ]; then
            echo 'Prerelease channel requires a prerelease SemVer version.' >&2
            exit 1
          fi
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag already exists: $VERSION" >&2
            exit 1
          fi
          chart_version="${VERSION#v}"
          version_core="${VERSION#v}"
          version_core="${version_core%%-*}"
          IFS=. read -r major minor patch <<< "$version_core"
          {
            printf 'version=%s\n' "$VERSION"
            printf 'chart_version=%s\n' "$chart_version"
            printf 'major=v%s\n' "$major"
            printf 'minor=v%s.%s\n' "$major" "$minor"
            printf 'prerelease=%s\n' "$prerelease"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build-release-${{ matrix.component }}
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            package: azents-server
            dockerfile: azents.Dockerfile
            extra_context: ""
          - component: web
            package: azents-web
            dockerfile: azents-web.Dockerfile
            extra_context: "--build-context next-cache=/tmp/next-cache"
          - component: admin-web
            package: azents-admin-web
            dockerfile: azents-admin-web.Dockerfile
            extra_context: "--build-context next-cache=/tmp/next-cache"
          - component: runtime-runner
            package: azents-runtime-runner
            dockerfile: python/apps/azents-runtime-runner/Dockerfile
            extra_context: ""
          - component: runtime-proxy
            package: azents-runtime-proxy
            dockerfile: python/apps/azents-runtime-proxy/Dockerfile
            extra_context: ""
          - component: runtime-engine
            package: azents-runtime-engine
            dockerfile: images/azents-runtime-engine/Dockerfile
            extra_context: ""
          - component: runtime-provider-kubernetes
            package: azents-runtime-provider-kubernetes
            dockerfile: python/apps/azents-runtime-provider-kubernetes/Dockerfile
            extra_context: ""
          - component: runtime-provider-docker
            package: azents-runtime-provider-docker
            dockerfile: python/apps/azents-runtime-provider-docker/Dockerfile
            extra_context: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Prepare empty Next.js cache context
        run: mkdir -p /tmp/next-cache/next-cache
      - name: Build and push release image
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          MAJOR_TAG: ${{ needs.validate.outputs.major }}
          MINOR_TAG: ${{ needs.validate.outputs.minor }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.package }}
        run: |
          set -euo pipefail
          mkdir -p image-metadata
          tags=(--tag "${IMAGE}:${VERSION}")
          if [ "$PRERELEASE" != 'true' ]; then
            tags+=(--tag "${IMAGE}:${MINOR_TAG}" --tag "${IMAGE}:${MAJOR_TAG}" --tag "${IMAGE}:latest")
          fi
          docker buildx build \
            --push \
            --provenance=true \
            --sbom=true \
            --metadata-file /tmp/build-metadata.json \
            ${{ matrix.extra_context }} \
            --label "org.opencontainers.image.source=https://github.com/azents/azents" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.title=${{ matrix.component }}" \
            "${tags[@]}" \
            -f "${{ matrix.dockerfile }}" \
            .
          digest="$(jq -r '."containerimage.digest"' /tmp/build-metadata.json)"
          jq -n \
            --arg component "${{ matrix.component }}" \
            --arg package "${{ matrix.package }}" \
            --arg image "$IMAGE" \
            --arg version "$VERSION" \
            --arg digest "$digest" \
            '{component: $component, package: $package, image: $image, version: $version, digest: $digest}' \
            > "image-metadata/${{ matrix.component }}.json"
      - name: Upload image metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image-metadata-${{ matrix.component }}
          path: image-metadata/${{ matrix.component }}.json
          if-no-files-found: error

  publish-chart:
    name: publish-helm-chart
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Login Helm to GHCR
        run: echo "${{ github.token }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Package, validate, and push chart
        env:
          CHART_VERSION: ${{ needs.validate.outputs.chart_version }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/azents-chart
          helm package infra/charts/azents \
            --version "$CHART_VERSION" \
            --app-version "$CHART_VERSION" \
            --destination /tmp/azents-chart
          chart_path="/tmp/azents-chart/azents-${CHART_VERSION}.tgz"
          chart_metadata="$(helm show chart "$chart_path")"
          actual_version="$(awk '$1 == "version:" {print $2}' <<< "$chart_metadata")"
          actual_app_version="$(awk '$1 == "appVersion:" {print $2}' <<< "$chart_metadata")"
          if [ "$actual_version" != "$CHART_VERSION" ] || [ "$actual_app_version" != "$CHART_VERSION" ]; then
            echo "Packaged chart version/appVersion must both be $CHART_VERSION; got version=$actual_version appVersion=$actual_app_version" >&2
            exit 1
          fi
          helm push "$chart_path" oci://ghcr.io/azents/charts

  github-release:
    name: github-release
    needs:
      - validate
      - build
      - publish-chart
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download image metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-image-metadata-*
          path: image-metadata
          merge-multiple: true
      - name: Build release notes
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          CHART_VERSION: ${{ needs.validate.outputs.chart_version }}
        run: |
          set -euo pipefail
          {
            printf '# Azents %s\n\n' "$VERSION"
            printf '## Images\n\n'
            jq -rs '. | sort_by(.component)[] | "- `\(.image):\(.version)`\n  - digest: `\(.digest)`"' image-metadata/*.json
            printf '\n## Helm chart\n\n'
            printf -- '- `oci://ghcr.io/azents/charts/azents:%s`\n\n' "$CHART_VERSION"
            printf '## Provenance and SBOM\n\n'
            printf 'Image provenance and SBOM attestations are available through GHCR/GitHub attestations.\n'
          } > release-notes.md
          cat release-notes.md
      - name: Create Git tag
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=("$VERSION" --verify-tag --title "Azents $VERSION" --notes-file release-notes.md)
          if [ "$PRERELEASE" = 'true' ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"

  dispatch-release:
    name: downstream-release-dispatch
    needs:
      - validate
      - github-release
    runs-on: ubuntu-latest
    env:
      HAS_DOWNSTREAM_TOKEN: ${{ secrets.DOWNSTREAM_DEPLOY_TOKEN != '' }}
      DOWNSTREAM_REPOSITORY: ${{ vars.DOWNSTREAM_DEPLOY_REPOSITORY }}
      DOWNSTREAM_EVENT_TYPE: ${{ vars.DOWNSTREAM_RELEASE_EVENT_TYPE || 'azents_release_published' }}
    steps:
      - name: Download release image metadata for dispatch
        if: env.HAS_DOWNSTREAM_TOKEN == 'true' && env.DOWNSTREAM_REPOSITORY != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-image-metadata-*
          path: image-metadata
          merge-multiple: true
      - name: Build release payload
        if: env.HAS_DOWNSTREAM_TOKEN == 'true' && env.DOWNSTREAM_REPOSITORY != ''
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          CHANNEL: ${{ inputs.channel }}
          CHART_VERSION: ${{ needs.validate.outputs.chart_version }}
        run: |
          set -euo pipefail
          jq -s \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg ref "$GITHUB_REF" \
            --arg sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg version "$VERSION" \
            --arg channel "$CHANNEL" \
            --arg chart_reference "oci://ghcr.io/azents/charts/azents" \
            --arg chart_version "$CHART_VERSION" \
            '{
              schemaVersion: 1,
              repository: $repository,
              ref: $ref,
              sha: $sha,
              runId: $run_id,
              version: $version,
              channel: $channel,
              chart: {
                reference: $chart_reference,
                version: $chart_version
              },
              images: (
                map({
                  component,
                  image,
                  tag: .version,
                  digest
                })
                | sort_by(.component)
              )
            }' \
            image-metadata/*.json > release-payload.json
          jq -n \
            --arg event_type "$DOWNSTREAM_EVENT_TYPE" \
            --slurpfile client_payload release-payload.json \
            '{event_type: $event_type, client_payload: $client_payload[0]}' \
            > dispatch-body.json
          cat release-payload.json
      - name: Dispatch downstream release
        if: env.HAS_DOWNSTREAM_TOKEN == 'true' && env.DOWNSTREAM_REPOSITORY != ''
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${DOWNSTREAM_REPOSITORY}/dispatches" \
            --input dispatch-body.json
      - name: Skip downstream release dispatch
        if: env.HAS_DOWNSTREAM_TOKEN != 'true' || env.DOWNSTREAM_REPOSITORY == ''
        run: echo "Downstream dispatch is not configured; the public release remains published."
