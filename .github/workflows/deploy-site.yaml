name: Deploy Site

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-site.yaml
      - typescript/apps/azents-site/**
      - typescript/package.json
      - typescript/pnpm-lock.yaml
      - typescript/pnpm-workspace.yaml
      - typescript/tsconfig.base.json
      - typescript/turbo.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    name: build-and-publish-site-branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: typescript/package.json
      - name: Install dependencies
        run: cd typescript && pnpm install --frozen-lockfile
      - name: Build site
        env:
          SITE_GOOGLE_ANALYTICS_ID: ${{ vars.SITE_GOOGLE_ANALYTICS_ID }}
        run: cd typescript && pnpm run build --filter=@azents/site
      - name: Publish static site branch
        env:
          DEPLOY_BRANCH: site
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d)"
          cp -a typescript/apps/azents-site/out/. "${publish_dir}/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard HEAD
          git clean -fdx
          git switch --orphan "${DEPLOY_BRANCH}-publish"
          git rm -rf --ignore-unmatch .
          git clean -fdx
          cp -a "${publish_dir}/". .
          git add -A
          if git diff --cached --quiet; then
            echo "Static site output is unchanged."
            exit 0
          fi
          git commit -m "Deploy Azents site"
          git push --force origin HEAD:"${DEPLOY_BRANCH}"
