name: E2E duration reevaluation

on:
  pull_request_target:
    types: [edited]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  actions: read
  pull-requests: write
  statuses: write

jobs:
  recheck:
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_run'
      || github.event.changes.base != null
    runs-on: ubuntu-latest
    steps:
      - name: Load trusted gate helper
        id: helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq .object.sha)"
          mkdir -p trusted/support
          if ! gh api "repos/${GITHUB_REPOSITORY}/contents/testenv/azents/e2e/src/support/ci_duration_gate.py" \
            --method GET \
            --raw-field ref="$sha" \
            --jq .content \
            | base64 --decode \
            > trusted/support/ci_duration_gate.py; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Reevaluate affected pull requests
        if: steps.helper.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'pull_request_target' ]; then
            numbers='${{ github.event.pull_request.number }}'
          elif [ "$GITHUB_EVENT_NAME" = 'workflow_run' ]; then
            if [ "$WORKFLOW_HEAD_BRANCH" = 'main' ]; then
              base_sha="$WORKFLOW_HEAD_SHA"
              numbers="$(
                gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" \
                  --jq ".[] | select(.base.sha == \"${base_sha}\" and .head.repo.full_name == \"${GITHUB_REPOSITORY}\") | .number"
              )"
            else
              numbers="$(
                gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${WORKFLOW_RUN_ID}/pull_requests" \
                  --jq ".[] | select(.head.repo.full_name == \"${GITHUB_REPOSITORY}\") | .number"
              )"
            fi
          else
            numbers="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq '.[].number')"
          fi
          for number in $numbers; do
            PYTHONPATH=trusted python -m support.ci_duration_gate recheck \
              --repository "$GITHUB_REPOSITORY" \
              --pull-number "$number" \
              --work-dir "${RUNNER_TEMP}/e2e-duration-${number}"
          done
