name: iOS

on:
  pull_request:
    paths:
      - swift/**
      - .github/workflows/ios.yaml
      - .claude/conventions/swift/**
      - .claude/rules/swift-conventions.md
  push:
    branches:
      - main
    paths:
      - swift/**
      - .github/workflows/ios.yaml
      - .claude/conventions/swift/**
      - .claude/rules/swift-conventions.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: ios-quality-build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Format, lint, simulator test, and unsigned builds
        run: bash swift/scripts/ios.sh ci
      - name: Upload app build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-app-builds-${{ github.sha }}
          path: swift/.build/artifacts/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Upload test results and build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-diagnostics-${{ github.sha }}
          path: |
            swift/.build/*.log
            swift/.build/*.xcresult
            swift/.build/screenshots/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
