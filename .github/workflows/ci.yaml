name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ github.event_name != 'pull_request' || steps.filter.outputs.python == 'true' }}
      python_e2e: ${{ github.event_name != 'pull_request' || steps.filter.outputs['python-e2e'] == 'true' }}
      web_e2e: ${{ github.event_name != 'pull_request' || steps.filter.outputs['web-e2e'] == 'true' }}
      e2e_server_image: ${{ steps.filter.outputs['e2e-server-image'] == 'true' }}
      e2e_runtime_runner_image: ${{ steps.filter.outputs['e2e-runtime-runner-image'] == 'true' }}
      e2e_runtime_provider_docker_image: ${{ steps.filter.outputs['e2e-runtime-provider-docker-image'] == 'true' }}
      typescript: ${{ github.event_name != 'pull_request' || steps.filter.outputs.typescript == 'true' }}
      helm: ${{ github.event_name != 'pull_request' || steps.filter.outputs.helm == 'true' }}
      docker: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docker == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compute changed scopes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.ref }}
          filters: |
            python:
              - '.github/workflows/**'
              - '.pre-commit-config.yaml'
              - 'proto/**'
              - 'python/apps/azents/**'
              - 'python/apps/azents-runtime-provider-docker/**'
              - 'python/apps/azents-runtime-provider-kubernetes/**'
              - 'python/apps/azents-runtime-proxy/**'
              - 'python/apps/azents-runtime-runner/**'
              - 'python/libs/az-common/**'
              - 'python/libs/azents-runtime-control/**'
            python-e2e:
              - '.github/workflows/**'
              - 'azents.Dockerfile'
              - 'docker-compose.azents.yaml'
              - 'proto/**'
              - 'python/apps/azents/**'
              - 'python/apps/azents-runtime-provider-docker/**'
              - 'python/apps/azents-runtime-provider-kubernetes/**'
              - 'python/apps/azents-runtime-proxy/**'
              - 'python/apps/azents-runtime-runner/**'
              - 'python/libs/az-common/**'
              - 'python/libs/azents-admin-client/**'
              - 'python/libs/azents-public-client/**'
              - 'python/libs/azents-runtime-control/**'
              - 'testenv/azents/**'
            web-e2e:
              - '.dockerignore'
              - '.github/workflows/**'
              - 'azents.Dockerfile'
              - 'azents-admin-web.Dockerfile'
              - 'azents-web.Dockerfile'
              - 'proto/**'
              - 'python/apps/azents/**'
              - 'python/apps/azents-runtime-provider-docker/**'
              - 'python/apps/azents-runtime-runner/**'
              - 'python/libs/az-common/**'
              - 'python/libs/azents-admin-client/**'
              - 'python/libs/azents-public-client/**'
              - 'python/libs/azents-runtime-control/**'
              - 'testenv/azents/**'
              - 'typescript/**'
            e2e-server-image:
              - '.dockerignore'
              - 'azents.Dockerfile'
              - 'python/apps/azents/**'
              - 'python/libs/az-common/**'
              - 'python/libs/azents-runtime-control/**'
            e2e-runtime-runner-image:
              - '.dockerignore'
              - 'python/apps/azents-runtime-runner/**'
              - 'python/libs/azents-runtime-control/**'
            e2e-runtime-provider-docker-image:
              - '.dockerignore'
              - 'python/apps/azents-runtime-provider-docker/**'
              - 'python/libs/azents-runtime-control/**'
            typescript:
              - '.github/workflows/**'
              - 'azents-admin-web.Dockerfile'
              - 'azents-web.Dockerfile'
              - 'python/apps/azents/specs/**'
              - 'typescript/**'
            helm:
              - '.github/workflows/**'
              - 'infra/charts/azents/**'
            docker:
              - '.dockerignore'
              - '.github/workflows/**'
              - '*.Dockerfile'
              - 'images/**'
              - 'proto/**'
              - 'python/apps/azents/**'
              - 'python/apps/azents-runtime-provider-docker/**'
              - 'python/apps/azents-runtime-provider-kubernetes/**'
              - 'python/apps/azents-runtime-proxy/**'
              - 'python/apps/azents-runtime-runner/**'
              - 'python/libs/az-common/**'
              - 'python/libs/azents-runtime-control/**'
              - 'typescript/**'

  ci-pre-commit:
    name: ci-pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Cache pre-commit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: python -m pip install --upgrade pre-commit
      - name: Run pre-commit structural hooks
        env:
          SKIP: ruff-check,ruff-format,ty-az-common,ty-azents-runtime-control,dump-openapi-spec-azents,ty-azents,ty-testenv-azents,ty-testenv-azents-e2e,ts-format,ts-lint,ts-typecheck
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  ci_python_run:
    name: ci-python-run
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: python/libs/az-common
          - project: python/libs/azents-runtime-control
          - project: python/apps/azents
          - project: python/apps/azents-runtime-runner
          - project: python/apps/azents-runtime-proxy
          - project: python/apps/azents-runtime-provider-kubernetes
          - project: python/apps/azents-runtime-provider-docker
          - project: testenv/azents
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          cd "${{ matrix.project }}"
          uv sync
      - name: Ruff check
        run: |
          cd "${{ matrix.project }}"
          uv run ruff check .
      - name: Ruff format check
        run: |
          cd "${{ matrix.project }}"
          uv run ruff format --check .
      - name: ty
        run: |
          cd "${{ matrix.project }}"
          uv run ty check --error-on-warning
      - name: Pytest
        run: |
          cd "${{ matrix.project }}"
          uv run pytest -vv
      - name: Verify OpenAPI spec drift
        if: matrix.project == 'python/apps/azents'
        run: |
          cd python/apps/azents
          uv run python src/cli/dump_openapi.py
          git diff --exit-code -- specs

  ci_python_migrations_run:
    name: ci-python-migrations-run
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: azents_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d azents_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AZENTS_MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/azents_migrations
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          cd python/apps/azents
          uv sync
      - name: Run pytest-alembic migration suite
        run: |
          cd python/apps/azents
          uv run pytest -vv migration_tests

  ci-python:
    name: ci-python
    needs:
      - changes
      - ci_python_run
      - ci_python_migrations_run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate Python result
        run: |
          changes_result='${{ needs.changes.result }}'
          changed='${{ needs.changes.outputs.python }}'
          result='${{ needs.ci_python_run.result }}'
          migrations_result='${{ needs.ci_python_migrations_run.result }}'
          if [ "$changes_result" != 'success' ]; then
            echo "changes job failed or was skipped: $changes_result"
            exit 1
          fi
          if [ "$changed" != 'true' ]; then
            echo 'Python scope unchanged; passing.'
            exit 0
          fi
          if [ "$result" = 'success' ] && [ "$migrations_result" = 'success' ]; then
            exit 0
          fi
          echo "Python scope changed but results were: app=$result migrations=$migrations_result"
          exit 1

  ci_testenv_support_run:
    name: ci-testenv-support-run
    needs: changes
    if: >-
      needs.changes.outputs.python_e2e == 'true'
      || needs.changes.outputs.web_e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          cd testenv/azents/e2e
          uv sync
      - name: Ruff check
        run: |
          cd testenv/azents/e2e
          uv run ruff check .
      - name: Ruff format check
        run: |
          cd testenv/azents/e2e
          uv run ruff format --check .
      - name: ty
        run: |
          cd testenv/azents/e2e
          uv run ty check --error-on-warning
      - name: Verify Runtime Docker workflows
        run: python testenv/azents/scripts/verify-runtime-docker.py
      - name: Run E2E support tests
        run: |
          cd testenv/azents/e2e
          uv run pytest -vv ./src/support_tests

  ci_e2e_plan:
    name: ci-e2e-plan
    needs: changes
    if: >-
      needs.changes.outputs.python_e2e == 'true'
      || needs.changes.outputs.web_e2e == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore E2E timing baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/e2e-timing-baseline
          key: e2e-timing-baseline-${{ github.run_id }}
          restore-keys: |
            e2e-timing-baseline-
      - name: Plan enabled E2E suites
        id: plan
        env:
          PYTHON_E2E: ${{ needs.changes.outputs.python_e2e }}
          WEB_E2E: ${{ needs.changes.outputs.web_e2e }}
        run: |
          cd testenv/azents/e2e
          args=(
            --tests-root src/tests
            --output-dir "$GITHUB_WORKSPACE/e2e-plan"
            --github-output "$GITHUB_OUTPUT"
          )
          if [ "$PYTHON_E2E" = 'true' ]; then
            args+=(--enabled-suite required)
          fi
          if [ "$WEB_E2E" = 'true' ]; then
            args+=(--enabled-suite web)
          fi
          timing_file="${RUNNER_TEMP}/e2e-timing-baseline/pytest-timings.jsonl"
          if [ -s "$timing_file" ]; then
            args+=(--timings "$timing_file")
          fi
          python src/support/e2e_planner.py "${args[@]}"
      - name: Upload E2E plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-plan
          path: e2e-plan
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  ci_e2e_run:
    name: ci-e2e-${{ matrix.lane }}
    needs:
      - changes
      - ci_testenv_support_run
      - ci_e2e_plan
    if: needs.ci_e2e_plan.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ci_e2e_plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Resolve required E2E snapshot base
        id: snapshot_base
        if: matrix.suite == 'required'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          base_sha=''
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              ;;
            push)
              if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
                base_sha="$PUSH_BASE_SHA"
              fi
              ;;
            workflow_dispatch)
              base_sha="$(git rev-parse HEAD^)"
              ;;
          esac
          if [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] \
            && [ "$base_sha" != '0000000000000000000000000000000000000000' ]; then
            printf 'base_sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"
          else
            printf 'base_sha=\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare unchanged required E2E snapshot images
        id: snapshot_images
        if: steps.snapshot_base.outputs.base_sha != ''
        env:
          AZENTS_E2E_BASE_SHA: ${{ steps.snapshot_base.outputs.base_sha }}
          AZENTS_E2E_SERVER_IMAGE_CHANGED: ${{ needs.changes.outputs.e2e_server_image }}
          AZENTS_E2E_RUNTIME_RUNNER_IMAGE_CHANGED: ${{ needs.changes.outputs.e2e_runtime_runner_image }}
          AZENTS_E2E_RUNTIME_PROVIDER_DOCKER_IMAGE_CHANGED: ${{ needs.changes.outputs.e2e_runtime_provider_docker_image }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          report_dir="${RUNNER_TEMP}/e2e-observability/${{ matrix.lane }}"
          mkdir -p "$report_dir"
          python testenv/azents/e2e/src/support/e2e_snapshot_images.py \
            --artifact-dir "$report_dir" \
            --github-env "$GITHUB_ENV" \
            --github-output "$GITHUB_OUTPUT"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Setup Docker Buildx
        if: steps.snapshot_images.outputs.all_images_prepared != 'true'
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Expose GitHub Actions runtime
        if: steps.snapshot_images.outputs.all_images_prepared != 'true'
        uses: ./.github/actions/expose-github-runtime
      - name: Install dependencies
        run: |
          cd testenv/azents/e2e
          uv sync
      - name: Download E2E plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-plan
          path: e2e-plan
      - name: Run E2E lane
        env:
          CACHE_WRITE_REPOSITORIES: ${{ matrix.cache_write_repositories }}
          AZENTS_E2E_IMAGE_BUILD_PROFILE: ${{ matrix.suite }}
        run: |
          set -o pipefail
          report_dir="${RUNNER_TEMP}/e2e-observability/${{ matrix.lane }}"
          mkdir -p "$report_dir"
          mapfile -t test_files < "e2e-plan/${{ matrix.plan_file }}"
          cd testenv/azents/e2e
          cache_writers=''
          if [ "${{ github.event_name }}" = 'push' ] \
            && [ "${{ github.ref }}" = 'refs/heads/main' ]; then
            cache_writers="$CACHE_WRITE_REPOSITORIES"
          fi
          SECONDS=0
          set +e
          AZENTS_E2E_ARTIFACT_DIR="$report_dir" \
            AZENTS_E2E_DOCKER_BUILDER="${{ steps.buildx.outputs.name }}" \
            AZENTS_E2E_DOCKER_GHA_CACHE_SCOPE_PREFIX="azents-e2e-v1" \
            AZENTS_E2E_DOCKER_GHA_CACHE_WRITE_REPOSITORIES="$cache_writers" \
            uv run pytest -vv \
            --junitxml="$report_dir/junit.xml" \
            --durations=30 \
            --durations-min=0.25 \
            "${test_files[@]}"
          pytest_status=$?
          set -e
          printf '%s\n' "$SECONDS" > "$report_dir/lane-duration-seconds.txt"
          exit "$pytest_status"
      - name: Capture E2E diagnostics
        if: always()
        run: |
          report_dir="${RUNNER_TEMP}/e2e-observability/${{ matrix.lane }}"
          mkdir -p "$report_dir"
          timeout 30s docker ps -a --no-trunc > "$report_dir/docker-ps.txt" 2>&1 || true
          timeout 30s docker stats --all --no-stream > "$report_dir/docker-stats.txt" 2>&1 || true
          timeout 30s docker system df > "$report_dir/docker-system-df.txt" 2>&1 || true
          timeout 30s docker buildx du --builder "${{ steps.buildx.outputs.name }}" > "$report_dir/docker-buildx-du.txt" 2>&1 || true
          python testenv/azents/e2e/src/support/ci_observability.py summarize \
            --lane "${{ matrix.lane }}" \
            --job-result "${{ job.status }}" \
            --junit "$report_dir/junit.xml" \
            --timings "$report_dir/pytest-timings.jsonl" \
            --image-build-timings "$report_dir/image-build-timings.jsonl" \
            --lane-duration "$report_dir/lane-duration-seconds.txt" \
            --output "$report_dir/summary.md"
      - name: Upload E2E observability
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-observability-${{ matrix.lane }}
          path: ${{ runner.temp }}/e2e-observability/${{ matrix.lane }}
          if-no-files-found: warn
          overwrite: true
          retention-days: 14

  ci_e2e_aggregate:
    name: ci-e2e-aggregate
    needs:
      - changes
      - ci_e2e_plan
      - ci_e2e_run
    if: always() && needs.ci_e2e_plan.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Download E2E observability artifacts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-observability-*
          path: e2e-observability-artifacts
      - name: Aggregate timing baseline
        run: |
          mkdir -p "${RUNNER_TEMP}/e2e-timing-baseline"
          find e2e-observability-artifacts \
            -name pytest-timings.jsonl \
            -type f \
            -print0 \
            | sort -z \
            | xargs -0 -r cat \
            > "${RUNNER_TEMP}/e2e-timing-baseline/pytest-timings.jsonl"
      - name: Save E2E timing baseline
        if: >-
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && needs.ci_e2e_run.result == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/e2e-timing-baseline
          key: e2e-timing-baseline-${{ github.run_id }}
      - name: Gate E2E lanes
        env:
          PLAN_RESULT: ${{ needs.ci_e2e_plan.result }}
          RUN_RESULT: ${{ needs.ci_e2e_run.result }}
        run: |
          if [ "$PLAN_RESULT" != 'success' ]; then
            echo "E2E planner result was: $PLAN_RESULT"
            exit 1
          fi
          if [ "$RUN_RESULT" != 'success' ]; then
            echo "E2E runner result was: $RUN_RESULT"
            exit 1
          fi

  ci-python-e2e:
    name: ci-python-e2e
    needs:
      - changes
      - ci_testenv_support_run
      - ci_e2e_plan
      - ci_e2e_run
      - ci_e2e_aggregate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate E2E results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          E2E_CHANGED: ${{ needs.changes.outputs.python_e2e == 'true' || needs.changes.outputs.web_e2e == 'true' }}
          SUPPORT_RESULT: ${{ needs.ci_testenv_support_run.result }}
          PLAN_RESULT: ${{ needs.ci_e2e_plan.result }}
          RUN_RESULT: ${{ needs.ci_e2e_run.result }}
          AGGREGATE_RESULT: ${{ needs.ci_e2e_aggregate.result }}
        run: |
          if [ "$CHANGES_RESULT" != 'success' ]; then
            echo "changes job failed or was skipped: $CHANGES_RESULT"
            exit 1
          fi
          if [ "$E2E_CHANGED" != 'true' ]; then
            echo 'No E2E scope changed.'
            exit 0
          fi
          for result in "$SUPPORT_RESULT" "$PLAN_RESULT" "$RUN_RESULT" "$AGGREGATE_RESULT"; do
            if [ "$result" != 'success' ]; then
              echo "Required E2E result was: $result"
              exit 1
            fi
          done
          echo 'All enabled E2E suites passed.'

  ci_e2e_observability_comment:
    name: ci-e2e-observability-comment
    needs:
      - changes
      - ci_e2e_plan
      - ci_e2e_run
      - ci_e2e_aggregate
    if: >-
      always()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (
        needs.changes.outputs.python_e2e == 'true'
        || needs.changes.outputs.web_e2e == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download E2E observability artifacts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-observability-*
          path: e2e-observability-artifacts
      - name: Build sticky E2E observability comment
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_RESULT: ${{ needs.ci_e2e_run.result }}
        run: |
          {
            echo '## E2E CI observability'
            echo
            printf "Commit: \`%s\`\n\n" "$HEAD_SHA"
            printf '[Workflow run and full artifacts](%s)\n\n' "$RUN_URL"
            summaries=()
            while IFS= read -r summary; do
              summaries+=("$summary")
            done < <(find e2e-observability-artifacts -name summary.md -type f | sort)
            if [ "${#summaries[@]}" -eq 0 ]; then
              printf 'No lane summary artifact was available. Runner result: `%s`.\n\n' "$RUN_RESULT"
            else
              for summary in "${summaries[@]}"; do
                cat "$summary"
              done
            fi
            echo 'This comment is updated in place for each CI run.'
          } > e2e-observability-comment.md
      - name: Update sticky E2E observability comment
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: e2e-observability
          path: e2e-observability-comment.md
          skip_unchanged: true

  ci_typescript_run:
    name: ci-typescript-run
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: typescript/package.json
      - name: Install dependencies
        run: cd typescript && pnpm install --frozen-lockfile
      - name: Generate API clients
        run: cd typescript && pnpm run generate
      - name: Format check
        run: cd typescript && pnpm run format:check
      - name: Lint
        run: cd typescript && pnpm run lint
      - name: Typecheck
        run: cd typescript && pnpm run typecheck

  ci-typescript:
    name: ci-typescript
    needs:
      - changes
      - ci_typescript_run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate TypeScript result
        run: |
          changes_result='${{ needs.changes.result }}'
          changed='${{ needs.changes.outputs.typescript }}'
          result='${{ needs.ci_typescript_run.result }}'
          if [ "$changes_result" != 'success' ]; then
            echo "changes job failed or was skipped: $changes_result"
            exit 1
          fi
          if [ "$changed" != 'true' ]; then
            echo 'TypeScript scope unchanged; passing.'
            exit 0
          fi
          if [ "$result" = 'success' ]; then
            exit 0
          fi
          echo "TypeScript scope changed but ci-typescript-run result was: $result"
          exit 1

  ci_helm_run:
    name: ci-helm-run
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install pytest
        run: python -m pip install --upgrade pytest
      - name: Helm lint
        run: |
          helm lint infra/charts/azents \
            --set server.image.repository=repo/server \
            --set server.image.tag=sha \
            --set web.image.repository=repo/web \
            --set web.image.tag=sha \
            --set adminWeb.image.repository=repo/admin-web \
            --set adminWeb.image.tag=sha \
            --set secrets.existingSecrets.redis=azents-redis
      - name: Helm render tests
        run: python -m pytest -vv infra/charts/azents/tests

  ci-helm:
    name: ci-helm
    needs:
      - changes
      - ci_helm_run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate Helm result
        run: |
          changes_result='${{ needs.changes.result }}'
          changed='${{ needs.changes.outputs.helm }}'
          result='${{ needs.ci_helm_run.result }}'
          if [ "$changes_result" != 'success' ]; then
            echo "changes job failed or was skipped: $changes_result"
            exit 1
          fi
          if [ "$changed" != 'true' ]; then
            echo 'Helm scope unchanged; passing.'
            exit 0
          fi
          if [ "$result" = 'success' ]; then
            exit 0
          fi
          echo "Helm scope changed but ci-helm-run result was: $result"
          exit 1

  ci_docker_build_run:
    name: ci-docker-build-run
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: azents-server
            dockerfile: azents.Dockerfile
            image: azents-server:ci
            extra_context: ""
          - name: azents-web
            dockerfile: azents-web.Dockerfile
            image: azents-web:ci
            extra_context: "--build-context next-cache=/tmp/next-cache"
          - name: azents-admin-web
            dockerfile: azents-admin-web.Dockerfile
            image: azents-admin-web:ci
            extra_context: "--build-context next-cache=/tmp/next-cache"
          - name: azents-runtime-runner
            dockerfile: python/apps/azents-runtime-runner/Dockerfile
            image: azents-runtime-runner:ci
            extra_context: ""
          - name: azents-runtime-proxy
            dockerfile: python/apps/azents-runtime-proxy/Dockerfile
            image: azents-runtime-proxy:ci
            extra_context: ""
          - name: azents-runtime-engine
            dockerfile: images/azents-runtime-engine/Dockerfile
            image: azents-runtime-engine:ci
            extra_context: ""
          - name: azents-runtime-provider-kubernetes
            dockerfile: python/apps/azents-runtime-provider-kubernetes/Dockerfile
            image: azents-runtime-provider-kubernetes:ci
            extra_context: ""
          - name: azents-runtime-provider-docker
            dockerfile: python/apps/azents-runtime-provider-docker/Dockerfile
            image: azents-runtime-provider-docker:ci
            extra_context: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Prepare empty Next.js cache context
        run: mkdir -p /tmp/next-cache/next-cache
      - name: Build ${{ matrix.name }}
        run: |
          docker buildx build \
            --load \
            ${{ matrix.extra_context }} \
            -f "${{ matrix.dockerfile }}" \
            -t "${{ matrix.image }}" \
            .
      - name: Smoke ${{ matrix.name }}
        run: |
          set -euo pipefail
          case "${{ matrix.name }}" in
            azents-runtime-runner)
              docker run --rm --entrypoint sh "${{ matrix.image }}" -ec \
                'docker --version | grep -F "Docker version 29.7.2" &&
                 docker buildx version | grep -F "github.com/docker/buildx v0.36.1" &&
                 docker compose version | grep -F "Docker Compose version v5.4.0" &&
                 test -z "${DOCKER_BUILDKIT:-}" &&
                 test -z "${COMPOSE_DOCKER_CLI_BUILD:-}" &&
                 test ! -e /var/run/azents-engine/docker.sock'
              ;;
            azents-runtime-proxy)
              docker run --rm --entrypoint sh "${{ matrix.image }}" -ec \
                'test "$(id -u)" = 1000 &&
                 test "$(id -g)" = 1000 &&
                 /workspace/python/apps/azents-runtime-proxy/.venv/bin/mitmdump \
                   --version | grep -F "Mitmproxy: 12.2.3"'
              ;;
            azents-runtime-engine)
              docker run --rm --entrypoint dockerd "${{ matrix.image }}" --version \
                | grep -F 'Docker version 29.7.2'
              ;;
          esac

  ci-docker-build:
    name: ci-docker-build
    needs:
      - changes
      - ci_docker_build_run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate Docker build result
        run: |
          changes_result='${{ needs.changes.result }}'
          changed='${{ needs.changes.outputs.docker }}'
          result='${{ needs.ci_docker_build_run.result }}'
          if [ "$changes_result" != 'success' ]; then
            echo "changes job failed or was skipped: $changes_result"
            exit 1
          fi
          if [ "$changed" != 'true' ]; then
            echo 'Docker scope unchanged; passing.'
            exit 0
          fi
          if [ "$result" = 'success' ]; then
            exit 0
          fi
          echo "Docker scope changed but ci-docker-build-run result was: $result"
          exit 1
