name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ github.event_name != 'pull_request' || steps.filter.outputs.python == 'true' }}
      python_e2e: ${{ github.event_name != 'pull_request' || steps.filter.outputs['python-e2e'] == 'true' }}
      tool_search_runtime_provider_e2e: ${{ github.event_name != 'pull_request' || steps.filter.outputs['tool-search-runtime-provider-e2e'] == 'true' }}
      web_surface_e2e: ${{ github.event_name != 'pull_request' || steps.filter.outputs['web-surface-e2e'] == 'true' }}
      typescript: ${{ github.event_name != 'pull_request' || steps.filter.outputs.typescript == 'true' }}
      helm: ${{ github.event_name != 'pull_request' || steps.filter.outputs.helm == 'true' }}
      docker: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docker == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - name: Compute changed scopes
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            python:
              - '.github/workflows/**'
              - '.pre-commit-config.yaml'
              - 'proto/**'
              - 'python/apps/azents/**'
              - 'python/apps/azents-runtime-provider-docker/**'
              - 'python/apps/azents-runtime-provider-kubernetes/**'
              - 'python/apps/azents-runtime-runner/**'
              - 'python/libs/az-common/**'
              - 'python/libs/azents-runtime-control/**'
            python-e2e:
              - '.github/workflows/**'
              - 'azents.Dockerfile'
              - 'docker-compose.azents.yaml'
              - 'proto/**'
              - 'python/apps/azents/**'
              - 'python/apps/azents-runtime-provider-docker/**'
              - 'python/apps/azents-runtime-provider-kubernetes/**'
              - 'python/apps/azents-runtime-runner/**'
              - 'python/libs/az-common/**'
              - 'python/libs/azents-admin-client/**'
              - 'python/libs/azents-public-client/**'
              - 'python/libs/azents-runtime-control/**'
              - 'testenv/azents/**'
            tool-search-runtime-provider-e2e:
              - '.github/workflows/ci.yaml'
              - 'testenv/azents/e2e/src/support/aimock_fixtures/agents_md_loader.json'
              - 'testenv/azents/e2e/src/support/ci_observability.py'
              - 'testenv/azents/e2e/src/support/image_generation_openai_proxy.py'
              - 'testenv/azents/e2e/src/support/slack_provider_fake.py'
              - 'testenv/azents/e2e/src/tests/conftest.py'
              - 'testenv/azents/e2e/src/tests/azents/public/test_external_channels.py'
              - 'testenv/azents/e2e/src/tests/azents/public/test_runtime_hooks.py'
              - 'testenv/azents/e2e/src/tests/azents/public/test_runtime_profiles.py'
            web-surface-e2e:
              - '.dockerignore'
              - '.github/workflows/**'
              - 'azents.Dockerfile'
              - 'azents-admin-web.Dockerfile'
              - 'azents-web.Dockerfile'
              - 'proto/**'
              - 'python/apps/azents/**'
              - 'python/libs/az-common/**'
              - 'python/libs/azents-admin-client/**'
              - 'python/libs/azents-public-client/**'
              - 'python/libs/azents-runtime-control/**'
              - 'testenv/azents/**'
              - 'typescript/**'
            typescript:
              - '.github/workflows/**'
              - 'azents-admin-web.Dockerfile'
              - 'azents-web.Dockerfile'
              - 'python/apps/azents/specs/**'
              - 'typescript/**'
            helm:
              - '.github/workflows/**'
              - 'infra/charts/azents/**'
            docker:
              - '.dockerignore'
              - '.github/workflows/**'
              - '*.Dockerfile'
              - 'images/**'
              - 'proto/**'
              - 'python/apps/azents/**'
              - 'python/apps/azents-runtime-provider-docker/**'
              - 'python/apps/azents-runtime-provider-kubernetes/**'
              - 'python/apps/azents-runtime-runner/**'
              - 'python/libs/az-common/**'
              - 'python/libs/azents-runtime-control/**'
              - 'typescript/**'

  ci-pre-commit:
    name: ci-pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - name: Cache pre-commit
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: python -m pip install --upgrade pre-commit
      - name: Run pre-commit structural hooks
        env:
          SKIP: ruff-check,ruff-format,ty-az-common,ty-azents-runtime-control,dump-openapi-spec-azents,ty-azents,ty-testenv-azents,ty-testenv-azents-e2e,ts-format,ts-lint,ts-typecheck
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  ci_python_run:
    name: ci-python-run
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: python/libs/az-common
          - project: python/libs/azents-runtime-control
          - project: python/apps/azents
          - project: python/apps/azents-runtime-runner
          - project: python/apps/azents-runtime-provider-kubernetes
          - project: python/apps/azents-runtime-provider-docker
          - project: testenv/azents
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          cd "${{ matrix.project }}"
          uv sync
      - name: Ruff check
        run: |
          cd "${{ matrix.project }}"
          uv run ruff check .
      - name: Ruff format check
        run: |
          cd "${{ matrix.project }}"
          uv run ruff format --check .
      - name: ty
        run: |
          cd "${{ matrix.project }}"
          uv run ty check --error-on-warning
      - name: Pytest
        run: |
          cd "${{ matrix.project }}"
          uv run pytest -vv
      - name: Verify OpenAPI spec drift
        if: matrix.project == 'python/apps/azents'
        run: |
          cd python/apps/azents
          uv run python src/cli/dump_openapi.py
          git diff --exit-code -- specs

  ci_python_migrations_run:
    name: ci-python-migrations-run
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: azents_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d azents_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AZENTS_MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/azents_migrations
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          cd python/apps/azents
          uv sync
      - name: Run pytest-alembic migration suite
        run: |
          cd python/apps/azents
          uv run pytest -vv migration_tests

  ci-python:
    name: ci-python
    needs:
      - changes
      - ci_python_run
      - ci_python_migrations_run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate Python result
        run: |
          changes_result='${{ needs.changes.result }}'
          changed='${{ needs.changes.outputs.python }}'
          result='${{ needs.ci_python_run.result }}'
          migrations_result='${{ needs.ci_python_migrations_run.result }}'
          if [ "$changes_result" != 'success' ]; then
            echo "changes job failed or was skipped: $changes_result"
            exit 1
          fi
          if [ "$changed" != 'true' ]; then
            echo 'Python scope unchanged; passing.'
            exit 0
          fi
          if [ "$result" = 'success' ] && [ "$migrations_result" = 'success' ]; then
            exit 0
          fi
          echo "Python scope changed but results were: app=$result migrations=$migrations_result"
          exit 1

  ci_testenv_unit_run:
    name: ci-testenv-unit-run
    needs: changes
    if: needs.changes.outputs.python_e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          cd testenv/azents/e2e
          uv sync
      - name: Run testenv unit tests
        run: |
          cd testenv/azents/e2e
          uv run pytest -vv ./src/unit_tests

  ci_python_e2e_run:
    name: ci-deterministic-e2e-run
    needs: changes
    if: needs.changes.outputs.python_e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Expose GitHub Actions runtime
        uses: ./.github/actions/expose-github-runtime
      - name: Install dependencies
        run: |
          cd testenv/azents/e2e
          uv sync
      - name: Ruff check
        run: |
          cd testenv/azents/e2e
          uv run ruff check .
      - name: Ruff format check
        run: |
          cd testenv/azents/e2e
          uv run ruff format --check .
      - name: ty
        run: |
          cd testenv/azents/e2e
          uv run ty check --error-on-warning
      - name: Verify Runtime Docker workflows
        run: python testenv/azents/scripts/verify-runtime-docker.py
      - name: Run deterministic E2E
        run: |
          set -o pipefail
          report_dir="${RUNNER_TEMP}/e2e-observability/deterministic"
          mkdir -p "$report_dir"
          cd testenv/azents/e2e
          AZENTS_E2E_ARTIFACT_DIR="$report_dir" \
            AZENTS_E2E_DOCKER_BUILDER="${{ steps.buildx.outputs.name }}" \
            AZENTS_E2E_DOCKER_GHA_CACHE_SCOPE_PREFIX="azents-e2e-v1" \
            AZENTS_E2E_DOCKER_GHA_CACHE_WRITE_REPOSITORIES="${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'azents-server' || '' }}" \
            uv run pytest -vv \
            --junitxml="$report_dir/junit.xml" \
            --durations=30 \
            --durations-min=0.25 \
            -m "not live_external and not runtime_provider and not web_surface" \
            ./src/tests
      - name: Capture deterministic E2E diagnostics
        if: always()
        run: |
          report_dir="${RUNNER_TEMP}/e2e-observability/deterministic"
          mkdir -p "$report_dir"
          timeout 30s docker ps -a --no-trunc > "$report_dir/docker-ps.txt" 2>&1 || true
          timeout 30s docker stats --all --no-stream > "$report_dir/docker-stats.txt" 2>&1 || true
          timeout 30s docker system df > "$report_dir/docker-system-df.txt" 2>&1 || true
          timeout 30s docker buildx du --builder "${{ steps.buildx.outputs.name }}" > "$report_dir/docker-buildx-du.txt" 2>&1 || true
          python testenv/azents/e2e/src/support/ci_observability.py summarize \
            --lane "Deterministic E2E" \
            --job-result "${{ job.status }}" \
            --junit "$report_dir/junit.xml" \
            --output "$report_dir/summary.md"
      - name: Upload deterministic E2E observability
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-observability-deterministic
          path: ${{ runner.temp }}/e2e-observability/deterministic
          if-no-files-found: warn
          overwrite: true
          retention-days: 14

  ci_tool_search_runtime_provider_e2e_run:
    name: ci-tool-search-runtime-provider-e2e-run
    needs: changes
    if: needs.changes.outputs.tool_search_runtime_provider_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Expose GitHub Actions runtime
        uses: ./.github/actions/expose-github-runtime
      - name: Install dependencies
        run: |
          cd testenv/azents/e2e
          uv sync
      - name: Load Runtime containment AppArmor profile
        run: |
          test "$(cat /sys/module/apparmor/parameters/enabled)" = "Y"
          sudo apparmor_parser --replace \
            python/apps/azents-runtime-provider-docker/docker/apparmor/azents-runtime-bwrap
      - name: Run focused runtime-provider E2E
        run: |
          set -o pipefail
          report_dir="${RUNNER_TEMP}/e2e-observability/runtime-provider"
          mkdir -p "$report_dir"
          cd testenv/azents/e2e
          AZENTS_E2E_ARTIFACT_DIR="$report_dir" \
            AZENTS_E2E_DOCKER_BUILDER="${{ steps.buildx.outputs.name }}" \
            AZENTS_E2E_DOCKER_GHA_CACHE_SCOPE_PREFIX="azents-e2e-v1" \
            AZENTS_E2E_DOCKER_GHA_CACHE_WRITE_REPOSITORIES="${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'azents-runtime-runner,azents-runtime-provider-docker' || '' }}" \
            uv run pytest -vv -s \
            --junitxml="$report_dir/junit.xml" \
            --durations=30 \
            --durations-min=0.25 \
            src/tests/azents/public/test_runtime_hooks.py::TestRuntimeHooks::test_runtime_hooks_execute_through_public_chat_path \
            src/tests/azents/public/test_runtime_hooks.py::TestRuntimeHooks::test_tool_search_persists_deferred_probe_across_runs \
            src/tests/azents/public/test_external_channels.py::test_provider_native_channel_work_progress_journey \
            src/tests/azents/public/test_runtime_profiles.py::test_runtime_profile_precedence_applied_evidence_and_recreation
      - name: Unload Runtime containment AppArmor profile
        if: always()
        run: |
          sudo apparmor_parser --remove \
            python/apps/azents-runtime-provider-docker/docker/apparmor/azents-runtime-bwrap
      - name: Capture runtime-provider E2E diagnostics
        if: always()
        run: |
          report_dir="${RUNNER_TEMP}/e2e-observability/runtime-provider"
          mkdir -p "$report_dir"
          timeout 30s docker ps -a --no-trunc > "$report_dir/docker-ps.txt" 2>&1 || true
          timeout 30s docker stats --all --no-stream > "$report_dir/docker-stats.txt" 2>&1 || true
          timeout 30s docker system df > "$report_dir/docker-system-df.txt" 2>&1 || true
          timeout 30s docker buildx du --builder "${{ steps.buildx.outputs.name }}" > "$report_dir/docker-buildx-du.txt" 2>&1 || true
          python testenv/azents/e2e/src/support/ci_observability.py summarize \
            --lane "Focused Runtime Provider E2E" \
            --job-result "${{ job.status }}" \
            --junit "$report_dir/junit.xml" \
            --output "$report_dir/summary.md"
      - name: Upload runtime-provider E2E observability
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-observability-runtime-provider
          path: ${{ runner.temp }}/e2e-observability/runtime-provider
          if-no-files-found: warn
          overwrite: true
          retention-days: 14

  ci_web_surface_e2e_run:
    name: ci-web-surface-e2e-run
    needs: changes
    if: needs.changes.outputs.web_surface_e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Expose GitHub Actions runtime
        uses: ./.github/actions/expose-github-runtime
      - name: Install dependencies
        run: |
          cd testenv/azents/e2e
          uv sync
      - name: Run Web Surface E2E
        run: |
          set -o pipefail
          report_dir="${RUNNER_TEMP}/e2e-observability/web-surface"
          mkdir -p "$report_dir"
          cd testenv/azents/e2e
          AZENTS_E2E_ARTIFACT_DIR="$report_dir" \
            AZENTS_E2E_DOCKER_BUILDER="${{ steps.buildx.outputs.name }}" \
            AZENTS_E2E_DOCKER_GHA_CACHE_SCOPE_PREFIX="azents-e2e-v1" \
            AZENTS_E2E_DOCKER_GHA_CACHE_WRITE_REPOSITORIES="${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'azents-web,azents-admin-web' || '' }}" \
            uv run pytest -vv \
            --junitxml="$report_dir/junit.xml" \
            --durations=30 \
            --durations-min=0.25 \
            -m "web_surface and not live_external and not runtime_provider" \
            ./src/tests
      - name: Capture Web Surface E2E diagnostics
        if: always()
        run: |
          report_dir="${RUNNER_TEMP}/e2e-observability/web-surface"
          mkdir -p "$report_dir"
          timeout 30s docker ps -a --no-trunc > "$report_dir/docker-ps.txt" 2>&1 || true
          timeout 30s docker stats --all --no-stream > "$report_dir/docker-stats.txt" 2>&1 || true
          timeout 30s docker system df > "$report_dir/docker-system-df.txt" 2>&1 || true
          timeout 30s docker buildx du --builder "${{ steps.buildx.outputs.name }}" > "$report_dir/docker-buildx-du.txt" 2>&1 || true
          python testenv/azents/e2e/src/support/ci_observability.py summarize \
            --lane "Web Surface E2E" \
            --job-result "${{ job.status }}" \
            --junit "$report_dir/junit.xml" \
            --output "$report_dir/summary.md"
      - name: Upload Web Surface E2E observability
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-observability-web-surface
          path: ${{ runner.temp }}/e2e-observability/web-surface
          if-no-files-found: warn
          overwrite: true
          retention-days: 14

  ci-python-e2e:
    name: ci-python-e2e
    needs:
      - changes
      - ci_testenv_unit_run
      - ci_python_e2e_run
      - ci_tool_search_runtime_provider_e2e_run
      - ci_web_surface_e2e_run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate E2E results
        run: |
          changes_result='${{ needs.changes.result }}'
          unit_changed='${{ needs.changes.outputs.python_e2e }}'
          unit_result='${{ needs.ci_testenv_unit_run.result }}'
          deterministic_changed='${{ needs.changes.outputs.python_e2e }}'
          deterministic_result='${{ needs.ci_python_e2e_run.result }}'
          tool_search_runtime_provider_changed='${{ needs.changes.outputs.tool_search_runtime_provider_e2e }}'
          tool_search_runtime_provider_result='${{ needs.ci_tool_search_runtime_provider_e2e_run.result }}'
          web_surface_changed='${{ needs.changes.outputs.web_surface_e2e }}'
          web_surface_result='${{ needs.ci_web_surface_e2e_run.result }}'
          if [ "$changes_result" != 'success' ]; then
            echo "changes job failed or was skipped: $changes_result"
            exit 1
          fi
          if [ "$unit_changed" = 'true' ] \
            && [ "$unit_result" != 'success' ]; then
            echo "Testenv unit result was: $unit_result"
            exit 1
          fi
          if [ "$deterministic_changed" = 'true' ] \
            && [ "$deterministic_result" != 'success' ]; then
            echo "Deterministic E2E result was: $deterministic_result"
            exit 1
          fi
          if [ "$tool_search_runtime_provider_changed" = 'true' ] \
            && [ "$tool_search_runtime_provider_result" != 'success' ]; then
            echo "Tool Search runtime-provider E2E result was: $tool_search_runtime_provider_result"
            exit 1
          fi
          if [ "$web_surface_changed" = 'true' ] \
            && [ "$web_surface_result" != 'success' ]; then
            echo "Web Surface E2E result was: $web_surface_result"
            exit 1
          fi
          echo 'All changed E2E scopes passed.'

  ci_e2e_observability_comment:
    name: ci-e2e-observability-comment
    needs:
      - changes
      - ci_python_e2e_run
      - ci_tool_search_runtime_provider_e2e_run
      - ci_web_surface_e2e_run
    if: >-
      always()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (
        needs.changes.outputs.python_e2e == 'true'
        || needs.changes.outputs.tool_search_runtime_provider_e2e == 'true'
        || needs.changes.outputs.web_surface_e2e == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download E2E observability artifacts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-observability-*
          path: e2e-observability-artifacts
      - name: Build sticky E2E observability comment
        env:
          DETERMINISTIC_RESULT: ${{ needs.ci_python_e2e_run.result }}
          RUNTIME_PROVIDER_RESULT: ${{ needs.ci_tool_search_runtime_provider_e2e_run.result }}
          WEB_SURFACE_RESULT: ${{ needs.ci_web_surface_e2e_run.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          append_lane() {
            label="$1"
            key="$2"
            result="$3"
            summary="e2e-observability-artifacts/e2e-observability-${key}/summary.md"
            if [ -s "$summary" ]; then
              cat "$summary"
            else
              printf "### %s\n\nJob result: \`%s\`\n\n" "$label" "$result"
              printf 'No summary artifact was available. Inspect the workflow run.\n\n'
            fi
          }

          {
            echo '## E2E CI observability'
            echo
            printf "Commit: \`%s\`\n\n" "$HEAD_SHA"
            printf '[Workflow run and full artifacts](%s)\n\n' "$RUN_URL"
            append_lane \
              'Deterministic E2E' \
              'deterministic' \
              "$DETERMINISTIC_RESULT"
            append_lane \
              'Focused Runtime Provider E2E' \
              'runtime-provider' \
              "$RUNTIME_PROVIDER_RESULT"
            append_lane \
              'Web Surface E2E' \
              'web-surface' \
              "$WEB_SURFACE_RESULT"
            echo 'This comment is updated in place for each CI run.'
          } > e2e-observability-comment.md
      - name: Update sticky E2E observability comment
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: e2e-observability
          path: e2e-observability-comment.md
          skip_unchanged: true

  ci_typescript_run:
    name: ci-typescript-run
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install pnpm
        uses: pnpm/action-setup@f3d73ada1fa6e5c0c19973ff70a3f5cabf225cc5 # v6.0.0
        with:
          package_json_file: typescript/package.json
      - name: Install dependencies
        run: cd typescript && pnpm install --frozen-lockfile
      - name: Generate API clients
        run: cd typescript && pnpm run generate
      - name: Format check
        run: cd typescript && pnpm run format:check
      - name: Lint
        run: cd typescript && pnpm run lint
      - name: Typecheck
        run: cd typescript && pnpm run typecheck

  ci-typescript:
    name: ci-typescript
    needs:
      - changes
      - ci_typescript_run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate TypeScript result
        run: |
          changes_result='${{ needs.changes.result }}'
          changed='${{ needs.changes.outputs.typescript }}'
          result='${{ needs.ci_typescript_run.result }}'
          if [ "$changes_result" != 'success' ]; then
            echo "changes job failed or was skipped: $changes_result"
            exit 1
          fi
          if [ "$changed" != 'true' ]; then
            echo 'TypeScript scope unchanged; passing.'
            exit 0
          fi
          if [ "$result" = 'success' ]; then
            exit 0
          fi
          echo "TypeScript scope changed but ci-typescript-run result was: $result"
          exit 1

  ci_helm_run:
    name: ci-helm-run
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - name: Install pytest
        run: python -m pip install --upgrade pytest
      - name: Helm lint
        run: |
          helm lint infra/charts/azents \
            --set server.image.repository=repo/server \
            --set server.image.tag=sha \
            --set web.image.repository=repo/web \
            --set web.image.tag=sha \
            --set adminWeb.image.repository=repo/admin-web \
            --set adminWeb.image.tag=sha \
            --set secrets.existingSecrets.redis=azents-redis
      - name: Helm render tests
        run: python -m pytest -vv infra/charts/azents/tests

  ci-helm:
    name: ci-helm
    needs:
      - changes
      - ci_helm_run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate Helm result
        run: |
          changes_result='${{ needs.changes.result }}'
          changed='${{ needs.changes.outputs.helm }}'
          result='${{ needs.ci_helm_run.result }}'
          if [ "$changes_result" != 'success' ]; then
            echo "changes job failed or was skipped: $changes_result"
            exit 1
          fi
          if [ "$changed" != 'true' ]; then
            echo 'Helm scope unchanged; passing.'
            exit 0
          fi
          if [ "$result" = 'success' ]; then
            exit 0
          fi
          echo "Helm scope changed but ci-helm-run result was: $result"
          exit 1

  ci_docker_build_run:
    name: ci-docker-build-run
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: azents-server
            dockerfile: azents.Dockerfile
            image: azents-server:ci
            extra_context: ""
          - name: azents-web
            dockerfile: azents-web.Dockerfile
            image: azents-web:ci
            extra_context: "--build-context next-cache=/tmp/next-cache"
          - name: azents-admin-web
            dockerfile: azents-admin-web.Dockerfile
            image: azents-admin-web:ci
            extra_context: "--build-context next-cache=/tmp/next-cache"
          - name: azents-runtime-runner
            dockerfile: python/apps/azents-runtime-runner/Dockerfile
            image: azents-runtime-runner:ci
            extra_context: ""
          - name: azents-runtime-engine
            dockerfile: images/azents-runtime-engine/Dockerfile
            image: azents-runtime-engine:ci
            extra_context: ""
          - name: azents-runtime-provider-kubernetes
            dockerfile: python/apps/azents-runtime-provider-kubernetes/Dockerfile
            image: azents-runtime-provider-kubernetes:ci
            extra_context: ""
          - name: azents-runtime-provider-docker
            dockerfile: python/apps/azents-runtime-provider-docker/Dockerfile
            image: azents-runtime-provider-docker:ci
            extra_context: ""
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Prepare empty Next.js cache context
        run: mkdir -p /tmp/next-cache/next-cache
      - name: Build ${{ matrix.name }}
        run: |
          docker buildx build \
            --load \
            ${{ matrix.extra_context }} \
            -f "${{ matrix.dockerfile }}" \
            -t "${{ matrix.image }}" \
            .
      - name: Smoke ${{ matrix.name }}
        run: |
          set -euo pipefail
          case "${{ matrix.name }}" in
            azents-runtime-runner)
              docker run --rm --entrypoint sh "${{ matrix.image }}" -ec \
                'docker --version | grep -F "Docker version 28.5.2" &&
                 docker buildx version | grep -F "github.com/docker/buildx v0.29.1" &&
                 docker compose version | grep -F "Docker Compose version v2.40.3" &&
                 test -z "${DOCKER_BUILDKIT:-}" &&
                 test -z "${COMPOSE_DOCKER_CLI_BUILD:-}" &&
                 test ! -e /var/run/azents-engine/docker.sock'
              ;;
            azents-runtime-engine)
              docker run --rm --entrypoint dockerd "${{ matrix.image }}" --version \
                | grep -F 'Docker version 28.5.2'
              ;;
          esac

  ci-docker-build:
    name: ci-docker-build
    needs:
      - changes
      - ci_docker_build_run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate Docker build result
        run: |
          changes_result='${{ needs.changes.result }}'
          changed='${{ needs.changes.outputs.docker }}'
          result='${{ needs.ci_docker_build_run.result }}'
          if [ "$changes_result" != 'success' ]; then
            echo "changes job failed or was skipped: $changes_result"
            exit 1
          fi
          if [ "$changed" != 'true' ]; then
            echo 'Docker scope unchanged; passing.'
            exit 0
          fi
          if [ "$result" = 'success' ]; then
            exit 0
          fi
          echo "Docker scope changed but ci-docker-build-run result was: $result"
          exit 1
