name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ github.event_name != 'pull_request' || steps.filter.outputs.python == 'true' }}
      python_e2e: ${{ github.event_name != 'pull_request' || steps.filter.outputs['python-e2e'] == 'true' }}
      web_e2e: ${{ github.event_name != 'pull_request' || steps.filter.outputs['web-e2e'] == 'true' }}
      typescript: ${{ github.event_name != 'pull_request' || steps.filter.outputs.typescript == 'true' }}
      helm: ${{ github.event_name != 'pull_request' || steps.filter.outputs.helm == 'true' }}
      docker: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docker == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve changed-scope base
        id: change_base
        run: |
          base="$GITHUB_REF"
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            base="$(git rev-parse "$GITHUB_SHA^")"
          fi
          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"
      - name: Compute changed scopes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ steps.change_base.outputs.base }}
          filters: |
            python:
              - '.github/actions/**'
              - 'scripts/ci/**'
              - '.github/workflows/**'
              - '.pre-commit-config.yaml'
              - 'proto/**'
              - 'python/apps/azents/**'
              - 'python/apps/azents-llm-proxy/**'
              - 'python/apps/azents-runtime-provider-docker/**'
              - 'python/apps/azents-runtime-provider-kubernetes/**'
              - 'python/apps/azents-runtime-proxy/**'
              - 'python/apps/azents-runtime-runner/**'
              - 'python/libs/az-common/**'
              - 'python/libs/azents-runtime-control/**'
              - 'python/libs/azents-llm-contract/**'
            python-e2e:
              - '.github/actions/**'
              - 'scripts/ci/**'
              - '.github/workflows/**'
              - 'azents.Dockerfile'
              - 'azents-e2e-server-overlay.Dockerfile'
              - 'docker-compose.azents.yaml'
              - 'proto/**'
              - 'python/apps/azents/**'
              - 'python/apps/azents-runtime-provider-docker/**'
              - 'python/apps/azents-runtime-provider-kubernetes/**'
              - 'python/apps/azents-runtime-proxy/**'
              - 'python/apps/azents-runtime-runner/**'
              - 'python/libs/az-common/**'
              - 'python/libs/azents-admin-client/**'
              - 'python/libs/azents-public-client/**'
              - 'python/libs/azents-runtime-control/**'
              - 'testenv/azents/**'
            web-e2e:
              - '.github/actions/**'
              - 'scripts/ci/**'
              - '.dockerignore'
              - '.github/workflows/**'
              - 'azents.Dockerfile'
              - 'azents-e2e-server-overlay.Dockerfile'
              - 'azents-admin-web.Dockerfile'
              - 'azents-web.Dockerfile'
              - 'proto/**'
              - 'python/apps/azents/**'
              - 'python/apps/azents-runtime-provider-docker/**'
              - 'python/apps/azents-runtime-runner/**'
              - 'python/libs/az-common/**'
              - 'python/libs/azents-admin-client/**'
              - 'python/libs/azents-public-client/**'
              - 'python/libs/azents-runtime-control/**'
              - 'testenv/azents/**'
              - 'typescript/**'
            typescript:
              - '.github/actions/**'
              - '.github/workflows/**'
              - 'azents-admin-web.Dockerfile'
              - 'azents-web.Dockerfile'
              - 'python/apps/azents/specs/**'
              - 'typescript/**'
            helm:
              - '.github/actions/**'
              - 'scripts/ci/**'
              - '.github/workflows/**'
              - 'infra/charts/azents/**'
            docker:
              - '.github/actions/**'
              - '.dockerignore'
              - '.github/workflows/**'
              - '*.Dockerfile'
              - 'images/**'
              - 'proto/**'
              - 'python/apps/azents/**'
              - 'python/apps/azents-llm-proxy/**'
              - 'python/libs/azents-llm-contract/**'
              - 'python/apps/azents-runtime-provider-docker/**'
              - 'python/apps/azents-runtime-provider-kubernetes/**'
              - 'python/apps/azents-runtime-proxy/**'
              - 'python/apps/azents-runtime-runner/**'
              - 'python/libs/az-common/**'
              - 'python/libs/azents-runtime-control/**'
              - 'typescript/**'

  ci-pre-commit:
    name: ci-pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Cache pre-commit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: python -m pip install --upgrade pre-commit
      - name: Run pre-commit structural hooks
        env:
          SKIP: ruff-check,ruff-format,ty-azents-llm-proxy,ty-azents-llm-contract,ty-az-common,ty-azents-runtime-control,dump-openapi-spec-azents,ty-azents,ty-testenv-azents,ty-testenv-azents-e2e,ts-format,ts-lint,ts-typecheck
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  ci_python_run:
    name: ci-python-run
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: python/libs/az-common
            observation: python-az-common
          - project: python/libs/azents-runtime-control
            observation: python-runtime-control
          - project: python/libs/azents-llm-contract
            observation: python-llm-contract
          - project: python/apps/azents-llm-proxy
            observation: python-llm-proxy
          - project: python/apps/azents
            observation: python-azents
          - project: python/apps/azents-runtime-runner
            observation: python-runtime-runner
          - project: python/apps/azents-runtime-proxy
            observation: python-runtime-proxy
          - project: python/apps/azents-runtime-provider-kubernetes
            observation: python-provider-kubernetes
          - project: python/apps/azents-runtime-provider-docker
            observation: python-provider-docker
          - project: testenv/azents
            observation: python-testenv
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          cd "${{ matrix.project }}"
          if [ "${{ matrix.project }}" = 'python/apps/azents-llm-proxy' ]; then
            rustup toolchain install 1.98.0 --profile minimal
            rustup default 1.98.0
            export CARGO_BUILD_JOBS=2
            export CARGO_PROFILE_RELEASE_LTO=false
            export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          fi
          uv sync
      - name: Select Ubuntu archive for Runner browser dependencies
        if: matrix.project == 'python/apps/azents-runtime-runner'
        run: sudo -n python3 scripts/ci/apt_mirror.py --sources-root /etc/apt --require-selected
      - name: Install Runner Chromium engine
        if: matrix.project == 'python/apps/azents-runtime-runner'
        working-directory: python/apps/azents-runtime-runner
        run: uv run patchright install --with-deps chromium
      - name: Install Runner Firefox system dependencies
        if: matrix.project == 'python/apps/azents-runtime-runner'
        working-directory: python/apps/azents-runtime-runner
        run: uv run playwright install-deps firefox
      - name: Install Runner pinned Camoufox and model
        if: matrix.project == 'python/apps/azents-runtime-runner'
        working-directory: python/apps/azents-runtime-runner
        run: uv run python -m azents_runtime_runner.browser_install
      - name: Ruff check
        run: |
          cd "${{ matrix.project }}"
          uv run ruff check .
      - name: Ruff format check
        run: |
          cd "${{ matrix.project }}"
          uv run ruff format --check .
      - name: ty
        run: |
          cd "${{ matrix.project }}"
          uv run ty check --error-on-warning
      - name: Pytest
        run: |
          pytest_execution=()
          if [ "${{ matrix.project }}" = 'python/apps/azents' ]; then
            # Reuse the same runner/job; keep whole modules on one isolated worker.
            pytest_execution=(-n 2 --dist loadfile --max-worker-restart=0)
          fi
          python scripts/ci/run_pytest.py \
            --project "${{ matrix.project }}" \
            --name "${{ matrix.observation }}" \
            --artifact-dir "${RUNNER_TEMP}/ci-tests" -- -vv "${pytest_execution[@]}"
      - name: Verify OpenAPI spec drift
        if: matrix.project == 'python/apps/azents'
        run: |
          cd python/apps/azents
          uv run python src/cli/dump_openapi.py
          git diff --exit-code -- specs
      - name: Publish Python test observability
        if: always()
        uses: ./.github/actions/ci-test-observability
        with:
          name: ${{ matrix.observation }}
          directory: ${{ runner.temp }}/ci-tests

  ci_python_migrations_run:
    name: ci-python-migrations-run
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: azents_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d azents_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AZENTS_MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/azents_migrations
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          cd python/apps/azents
          uv sync
      - name: Run pytest-alembic migration suite
        run: |
          python scripts/ci/run_pytest.py \
            --project python/apps/azents --name python-migrations \
            --artifact-dir "${RUNNER_TEMP}/ci-tests" -- -vv migration_tests
      - name: Verify Alembic model drift
        env:
          AZ_AUTH_JWT_SECRET_KEY: migration-ci
          AZ_CREDENTIAL_ENCRYPTION_KEY: migration-ci
          AZ_RDB_DB_NAME: azents_migrations
          AZ_RDB_HOST: localhost
          AZ_RDB_PASSWORD: postgres
          AZ_RDB_USER: postgres
        run: |
          cd python/apps/azents
          uv run alembic -c db-schemas/rdb/alembic.ini upgrade head
          uv run alembic -c db-schemas/rdb/alembic.ini check
      - name: Publish migration test observability
        if: always()
        uses: ./.github/actions/ci-test-observability
        with:
          name: python-migrations
          directory: ${{ runner.temp }}/ci-tests

  ci-python:
    name: ci-python
    needs:
      - changes
      - ci_python_run
      - ci_python_migrations_run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate Python result
        run: |
          changes_result='${{ needs.changes.result }}'
          changed='${{ needs.changes.outputs.python }}'
          result='${{ needs.ci_python_run.result }}'
          migrations_result='${{ needs.ci_python_migrations_run.result }}'
          if [ "$changes_result" != 'success' ]; then
            echo "changes job failed or was skipped: $changes_result"
            exit 1
          fi
          if [ "$changed" != 'true' ]; then
            echo 'Python scope unchanged; passing.'
            exit 0
          fi
          if [ "$result" = 'success' ] && [ "$migrations_result" = 'success' ]; then
            exit 0
          fi
          echo "Python scope changed but results were: app=$result migrations=$migrations_result"
          exit 1

  ci_testenv_support_run:
    name: ci-testenv-support-run
    needs: changes
    if: >-
      needs.changes.outputs.python_e2e == 'true'
      || needs.changes.outputs.web_e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          cd testenv/azents/e2e
          uv sync
      - name: Ruff check
        run: |
          cd testenv/azents/e2e
          uv run ruff check .
      - name: Ruff format check
        run: |
          cd testenv/azents/e2e
          uv run ruff format --check .
      - name: ty
        run: |
          cd testenv/azents/e2e
          uv run ty check --error-on-warning
      - name: Verify Runtime Docker workflows
        run: python testenv/azents/scripts/verify-runtime-docker.py
      - name: Run E2E support tests
        run: |
          python scripts/ci/run_pytest.py \
            --project testenv/azents/e2e --name testenv-support \
            --artifact-dir "${RUNNER_TEMP}/ci-tests" -- -vv ./src/support_tests
      - name: CI tooling contracts
        run: python -m unittest discover -s scripts/ci/tests -v
      - name: Publish support test observability
        if: always()
        uses: ./.github/actions/ci-test-observability
        with:
          name: testenv-support
          directory: ${{ runner.temp }}/ci-tests

  ci_e2e_plan:
    name: ci-e2e-plan
    needs: changes
    if: >-
      needs.changes.outputs.python_e2e == 'true'
      || needs.changes.outputs.web_e2e == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore E2E timing baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/e2e-timing-baseline
          key: >-
            ${{ github.event_name == 'pull_request' && format('e2e-pr-timing-baseline-{0}', github.event.pull_request.head.sha) || 'e2e-timing-baseline' }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ github.event_name == 'pull_request' && format('e2e-pr-timing-baseline-{0}-', github.event.pull_request.head.sha) || 'e2e-timing-baseline-' }}
            e2e-timing-baseline-
      - name: Plan enabled E2E suites
        id: plan
        env:
          PYTHON_E2E: ${{ needs.changes.outputs.python_e2e }}
          WEB_E2E: ${{ needs.changes.outputs.web_e2e }}
        run: |
          cd testenv/azents/e2e
          args=(
            --tests-root src/tests
            --output-dir "$GITHUB_WORKSPACE/e2e-plan"
            --github-output "$GITHUB_OUTPUT"
          )
          if [ "$PYTHON_E2E" = 'true' ]; then
            args+=(--enabled-suite required)
          fi
          if [ "$WEB_E2E" = 'true' ]; then
            args+=(--enabled-suite web)
          fi
          timing_root="${RUNNER_TEMP}/e2e-timing-baseline"
          mkdir -p "$timing_root"
          timing_file="$(find "$timing_root" -type f -name '*.jsonl' -print -quit 2>/dev/null)"
          if [ -n "$timing_file" ]; then
            args+=(--timings "$timing_root")
          fi
          python src/support/e2e_planner.py "${args[@]}"
      - name: Upload E2E plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-plan
          path: e2e-plan
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  ci_e2e_run:
    name: ci-e2e-${{ matrix.lane }}
    needs:
      - changes
      - ci_testenv_support_run
      - ci_e2e_plan
      - ci_docker_build_run
    if: >-
      needs.ci_e2e_plan.result == 'success'
      && needs.ci_docker_build_run.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ci_e2e_plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          cd testenv/azents/e2e
          uv sync
      - name: Download E2E plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-plan
          path: e2e-plan
      - name: Prepare exact images and existing prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.ci.e2e_images prepare \
            --root "${RUNNER_TEMP}/e2e-images" \
            --suite "${{ matrix.suite }}" \
            --evidence "${RUNNER_TEMP}/e2e-observability/${{ matrix.lane }}"
      - name: Verify and load exact CI image portfolio
        run: |
          python -m scripts.ci.e2e_images load \
            --root "${RUNNER_TEMP}/e2e-images" \
            --suite "${{ matrix.suite }}" \
            --github-env "$GITHUB_ENV" \
            --evidence "${RUNNER_TEMP}/e2e-observability/${{ matrix.lane }}"
      - name: Clean image transfer archives
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP}/e2e-images"
      - name: Capture E2E runner capacity
        run: |
          report_dir="${RUNNER_TEMP}/e2e-observability/${{ matrix.lane }}"
          mkdir -p "$report_dir"
          capture_runner_observation() {
            local output="$1"
            shift
            if "$@" > "$output" 2>&1; then
              return 0
            fi
            printf '\nObservation unavailable: %s\n' "$*" >> "$output" || true
            printf '::warning::Runner observation unavailable: %s\n' "$*"
          }
          capture_runner_observation "$report_dir/runner-cpu.json" lscpu --json
          capture_runner_observation "$report_dir/runner-memory-before.txt" free --bytes
          for resource in cpu memory io; do
            capture_runner_observation "$report_dir/runner-pressure-${resource}-before.txt" cat "/proc/pressure/${resource}"
          done
      - name: Run E2E lane
        env:
          AZENTS_E2E_IMAGE_BUILD_PROFILE: ${{ matrix.suite }}
        run: |
          set -o pipefail
          report_dir="${RUNNER_TEMP}/e2e-observability/${{ matrix.lane }}"
          mkdir -p "$report_dir"
          mapfile -t test_files < "e2e-plan/${{ matrix.plan_file }}"
          cd testenv/azents/e2e
          parallel_args=()
          if [ "$AZENTS_E2E_IMAGE_BUILD_PROFILE" = 'web' ]; then
            # Each worker owns a full product stack; avoid in-runner contention.
            parallel_args=(
              -n 1 --dist loadfile --no-loadscope-reorder --max-worker-restart=0
            )
          fi
          SECONDS=0
          set +e
          AZENTS_E2E_ARTIFACT_DIR="$report_dir" \
            AZENTS_CI_ARTIFACT_DIR="$report_dir" \
            PYTHONPATH="$GITHUB_WORKSPACE" \
            uv run pytest -p scripts.ci.pytest_timing -p support.e2e_parallel -vv \
            --junitxml="$report_dir/junit.xml" \
            --durations=30 \
            --durations-min=0.25 \
            "${parallel_args[@]}" \
            "${test_files[@]}"
          pytest_status=$?
          set -e
          printf '%s\n' "$SECONDS" > "$report_dir/lane-duration-seconds.txt"
          exit "$pytest_status"
      - name: Capture E2E diagnostics
        if: always()
        run: |
          report_dir="${RUNNER_TEMP}/e2e-observability/${{ matrix.lane }}"
          mkdir -p "$report_dir"
          capture_runner_observation() {
            local output="$1"
            shift
            if "$@" > "$output" 2>&1; then
              return 0
            fi
            printf '\nObservation unavailable: %s\n' "$*" >> "$output" || true
            printf '::warning::Runner observation unavailable: %s\n' "$*"
          }
          capture_runner_observation "$report_dir/runner-memory-after.txt" free --bytes
          for resource in cpu memory io; do
            capture_runner_observation "$report_dir/runner-pressure-${resource}-after.txt" cat "/proc/pressure/${resource}"
          done
          timeout 30s docker ps -a --no-trunc > "$report_dir/docker-ps.txt" 2>&1 || true
          timeout 30s docker stats --all --no-stream > "$report_dir/docker-stats.txt" 2>&1 || true
          timeout 30s docker system df > "$report_dir/docker-system-df.txt" 2>&1 || true
          timeout 30s docker buildx du --builder default > "$report_dir/docker-buildx-du-default.txt" 2>&1 || true
          python scripts/ci/observability.py summarize \
            --lane "${{ matrix.lane }}" \
            --job-result "${{ job.status }}" \
            --junit "$report_dir/junit.xml" \
            --timings "$report_dir/pytest-timings.jsonl" \
            --image-build-timings "$report_dir/image-build-timings.jsonl" \
            --lane-duration "$report_dir/lane-duration-seconds.txt" \
            --output "$report_dir/summary.md"
      - name: Upload E2E observability
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-observability-${{ matrix.lane }}
          path: ${{ runner.temp }}/e2e-observability/${{ matrix.lane }}
          if-no-files-found: warn
          overwrite: true
          retention-days: 14

  ci_e2e_aggregate:
    name: ci-e2e-aggregate
    needs:
      - changes
      - ci_e2e_plan
      - ci_e2e_run
    if: always() && needs.ci_e2e_plan.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout duration gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download E2E observability artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-observability-*
          path: e2e-observability-artifacts
      - name: Restore E2E timing history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/e2e-timing-baseline
          key: >-
            ${{ github.event_name == 'pull_request' && format('e2e-pr-timing-baseline-{0}', github.event.pull_request.head.sha) || 'e2e-timing-baseline' }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ github.event_name == 'pull_request' && format('e2e-pr-timing-baseline-{0}-', github.event.pull_request.head.sha) || 'e2e-timing-baseline-' }}
            e2e-timing-baseline-
      - name: Aggregate rolling timing history
        run: |
          timing_root="${RUNNER_TEMP}/e2e-timing-baseline"
          timing_runs="${timing_root}/runs"
          mkdir -p "$timing_runs"
          legacy_timing="${timing_root}/pytest-timings.jsonl"
          if [ -s "$legacy_timing" ]; then
            mv "$legacy_timing" "${timing_runs}/000000000000-0.jsonl"
          else
            rm -f "$legacy_timing"
          fi
          current_timing="${timing_runs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jsonl"
          find e2e-observability-artifacts \
            -name pytest-timings.jsonl \
            -type f \
            -print0 \
            | sort -z \
            | xargs -0 -r cat \
            > "$current_timing"
          if [ ! -s "$current_timing" ]; then
            echo "::error::No E2E timing records were available to cache"
            exit 1
          fi
          mapfile -t timing_files < <(
            find "$timing_runs" \
              -maxdepth 1 \
              -type f \
              -name '*.jsonl' \
              -printf '%f\n' \
              | sort -V
          )
          declare -A retained_timing_files=()
          for suite in required web; do
            if [ "$suite" = 'required' ]; then
              suite_path_pattern='src/tests/(required/|azents/(public|admin)/|test_)'
            else
              suite_path_pattern='src/tests/(web/|azents/admin/test_01_admin_web.py)'
            fi
            mapfile -t suite_timing_files < <(
              grep \
                -E \
                -l \
                "$suite_path_pattern" \
                "${timing_runs}"/*.jsonl \
                2>/dev/null \
                | sort -V
            )
            retain_from=0
            if [ "${#suite_timing_files[@]}" -gt 3 ]; then
              retain_from=$(("${#suite_timing_files[@]}" - 3))
            fi
            for timing_file in "${suite_timing_files[@]:$retain_from}"; do
              retained_timing_files["$(basename "$timing_file")"]=1
            done
          done
          for timing_file in "${timing_files[@]}"; do
            if [ -z "${retained_timing_files[$timing_file]:-}" ]; then
              rm "${timing_runs}/${timing_file}"
            fi
          done
      - name: Save same-SHA PR E2E timing baseline
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && needs.ci_e2e_run.result == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/e2e-timing-baseline
          key: >-
            e2e-pr-timing-baseline-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save E2E timing baseline
        if: >-
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && needs.ci_e2e_run.result == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/e2e-timing-baseline
          key: e2e-timing-baseline-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Gate E2E duration against base
        id: duration
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          PYTHONPATH=testenv/azents/e2e/src \
            python -m support.ci_duration_gate gate \
            --artifacts-root e2e-observability-artifacts \
            --repository "$GITHUB_REPOSITORY" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --work-dir e2e-duration-base \
            --report-json e2e-duration-gate/report.json \
            --report-markdown e2e-duration-gate/summary.md
      - name: Publish E2E duration verdict
        if: always()
        run: cat e2e-duration-gate/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload E2E duration verdict
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-duration-gate
          path: e2e-duration-gate
          if-no-files-found: error
      - name: Gate E2E lanes
        env:
          PLAN_RESULT: ${{ needs.ci_e2e_plan.result }}
          RUN_RESULT: ${{ needs.ci_e2e_run.result }}
          DURATION_RESULT: ${{ steps.duration.outcome }}
        run: |
          if [ "$PLAN_RESULT" != 'success' ]; then
            echo "E2E planner result was: $PLAN_RESULT"
            exit 1
          fi
          if [ "$RUN_RESULT" != 'success' ]; then
            echo "E2E runner result was: $RUN_RESULT"
            exit 1
          fi
          if [ "$DURATION_RESULT" != 'success' ]; then
            echo "E2E duration result was: $DURATION_RESULT"
            exit 1
          fi

  ci-python-e2e:
    name: ci-python-e2e
    needs:
      - changes
      - ci_testenv_support_run
      - ci_e2e_plan
      - ci_e2e_run
      - ci_e2e_aggregate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate E2E results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          E2E_CHANGED: ${{ needs.changes.outputs.python_e2e == 'true' || needs.changes.outputs.web_e2e == 'true' }}
          SUPPORT_RESULT: ${{ needs.ci_testenv_support_run.result }}
          PLAN_RESULT: ${{ needs.ci_e2e_plan.result }}
          RUN_RESULT: ${{ needs.ci_e2e_run.result }}
          AGGREGATE_RESULT: ${{ needs.ci_e2e_aggregate.result }}
        run: |
          if [ "$CHANGES_RESULT" != 'success' ]; then
            echo "changes job failed or was skipped: $CHANGES_RESULT"
            exit 1
          fi
          if [ "$E2E_CHANGED" != 'true' ]; then
            echo 'No E2E scope changed.'
            exit 0
          fi
          for result in "$SUPPORT_RESULT" "$PLAN_RESULT" "$RUN_RESULT" "$AGGREGATE_RESULT"; do
            if [ "$result" != 'success' ]; then
              echo "Required E2E result was: $result"
              exit 1
            fi
          done
          echo 'All enabled E2E suites passed.'

  ci_observability:
    name: ci-observability
    needs:
      - changes
      - ci-pre-commit
      - ci-python
      - ci-python-e2e
      - ci-typescript
      - ci-helm
      - ci-docker-build
      - ci_e2e_run
      - ci_e2e_aggregate
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Capture workflow job and step evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci-workflow
          gh run view "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,attempt,status,conclusion,headSha,headBranch,event,workflowName,createdAt,jobs \
            > ci-workflow/run.json
          python scripts/ci/workflow_report.py \
            --run ci-workflow/run.json --repository "$GITHUB_REPOSITORY" \
            --output ci-workflow/summary.md
      - name: Download E2E observability artifacts
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-observability-*
          path: e2e-observability-artifacts
      - name: Download general CI test artifacts
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-observability-*-${{ github.run_attempt }}
          path: ci-test-artifacts
      - name: Download E2E duration verdict
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-duration-gate
          path: e2e-duration-gate
      - name: Build general CI observability report
        run: |
          python -m scripts.ci.build_comment \
            --run ci-workflow/run.json \
            --workflow ci-workflow/summary.md \
            --duration e2e-duration-gate/summary.md \
            --test-roots e2e-observability-artifacts ci-test-artifacts \
            --output ci-workflow/comment.md
          cat ci-workflow/comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload general CI workflow evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-workflow-${{ github.run_attempt }}
          path: ci-workflow
          retention-days: 14
          if-no-files-found: error
      - name: Update sticky CI observability comment
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          # Keep the hidden identity to update existing PR comments in place.
          header: e2e-observability
          path: ci-workflow/comment.md
          skip_unchanged: true

  ci_typescript_run:
    name: ci-typescript-run
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Keep native JUnit identities independent of the host's cached minor.
          node-version: "24.22.0"
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: typescript/package.json
      - name: Install dependencies
        run: cd typescript && pnpm install --frozen-lockfile
      - name: Generate API clients
        run: cd typescript && pnpm run generate
      - name: Format check
        run: cd typescript && pnpm run format:check
      - name: Lint
        run: cd typescript && pnpm run lint
      - name: Typecheck
        run: cd typescript && pnpm run typecheck
      - name: Session core contracts
        run: cd typescript && pnpm --filter @azents/session-core test
      - name: Web Node contracts
        run: |
          python scripts/ci/run_node_tests.py \
            --project typescript/apps/azents-web --name typescript-web \
            --artifact-dir "${RUNNER_TEMP}/web-node-tests" \
            'src/**/*.test.mts'
      - name: Publish Web Node test observability
        if: always()
        uses: ./.github/actions/ci-test-observability
        with:
          name: typescript-web
          directory: ${{ runner.temp }}/web-node-tests
      - name: Select Ubuntu archive for component browser dependencies
        run: sudo -n python3 scripts/ci/apt_mirror.py --sources-root /etc/apt --require-selected
      - name: Install component browser
        run: cd typescript && pnpm --filter @azents/web exec playwright install --with-deps chromium
      - name: Web component contracts
        run: |
          python -m scripts.ci.run_component_tests \
            --project typescript/apps/azents-web \
            --artifact-dir "${RUNNER_TEMP}/web-component-tests"
      - name: Publish Web component test observability
        if: always()
        uses: ./.github/actions/ci-test-observability
        with:
          name: typescript-web-components
          directory: ${{ runner.temp }}/web-component-tests

  ci-typescript:
    name: ci-typescript
    needs:
      - changes
      - ci_typescript_run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate TypeScript result
        run: |
          changes_result='${{ needs.changes.result }}'
          changed='${{ needs.changes.outputs.typescript }}'
          result='${{ needs.ci_typescript_run.result }}'
          if [ "$changes_result" != 'success' ]; then
            echo "changes job failed or was skipped: $changes_result"
            exit 1
          fi
          if [ "$changed" != 'true' ]; then
            echo 'TypeScript scope unchanged; passing.'
            exit 0
          fi
          if [ "$result" = 'success' ]; then
            exit 0
          fi
          echo "TypeScript scope changed but ci-typescript-run result was: $result"
          exit 1

  ci_helm_run:
    name: ci-helm-run
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install pytest
        run: python -m pip install --upgrade pytest
      - name: Helm lint
        run: |
          helm lint infra/charts/azents \
            --set server.image.repository=repo/server \
            --set server.image.tag=sha \
            --set web.image.repository=repo/web \
            --set web.image.tag=sha \
            --set adminWeb.image.repository=repo/admin-web \
            --set adminWeb.image.tag=sha \
            --set secrets.existingSecrets.redis=azents-redis
      - name: Helm render tests
        run: |
          python scripts/ci/run_pytest.py --system-python \
            --project . --name helm \
            --artifact-dir "${RUNNER_TEMP}/ci-tests" -- -vv infra/charts/azents/tests
      - name: Publish Helm test observability
        if: always()
        uses: ./.github/actions/ci-test-observability
        with:
          name: helm
          directory: ${{ runner.temp }}/ci-tests

  ci-helm:
    name: ci-helm
    needs:
      - changes
      - ci_helm_run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate Helm result
        run: |
          changes_result='${{ needs.changes.result }}'
          changed='${{ needs.changes.outputs.helm }}'
          result='${{ needs.ci_helm_run.result }}'
          if [ "$changes_result" != 'success' ]; then
            echo "changes job failed or was skipped: $changes_result"
            exit 1
          fi
          if [ "$changed" != 'true' ]; then
            echo 'Helm scope unchanged; passing.'
            exit 0
          fi
          if [ "$result" = 'success' ]; then
            exit 0
          fi
          echo "Helm scope changed but ci-helm-run result was: $result"
          exit 1

  ci_docker_build_run:
    name: ci-docker-build-run
    needs: changes
    if: >-
      needs.changes.outputs.docker == 'true'
      || needs.changes.outputs.python_e2e == 'true'
      || needs.changes.outputs.web_e2e == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: azents-server
            dockerfile: azents.Dockerfile
            image: azents-server:ci
            extra_context: ""
          - name: azents-llm-proxy
            dockerfile: python/apps/azents-llm-proxy/Dockerfile
            image: azents-llm-proxy:ci
            extra_context: ""
          - name: azents-web
            dockerfile: azents-web.Dockerfile
            image: azents-web:ci
            extra_context: "--build-context next-cache=/tmp/next-cache"
          - name: azents-admin-web
            dockerfile: azents-admin-web.Dockerfile
            image: azents-admin-web:ci
            extra_context: "--build-context next-cache=/tmp/next-cache"
          - name: azents-runtime-runner
            dockerfile: python/apps/azents-runtime-runner/Dockerfile
            image: azents-runtime-runner:ci
            extra_context: ""
          - name: azents-runtime-proxy
            dockerfile: python/apps/azents-runtime-proxy/Dockerfile
            image: azents-runtime-proxy:ci
            extra_context: ""
          - name: azents-runtime-engine
            dockerfile: images/azents-runtime-engine/Dockerfile
            image: azents-runtime-engine:ci
            extra_context: ""
          - name: azents-runtime-provider-kubernetes
            dockerfile: python/apps/azents-runtime-provider-kubernetes/Dockerfile
            image: azents-runtime-provider-kubernetes:ci
            extra_context: ""
          - name: azents-runtime-provider-docker
            dockerfile: python/apps/azents-runtime-provider-docker/Dockerfile
            image: azents-runtime-provider-docker:ci
            extra_context: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Expose existing Runtime Runner build cache
        if: matrix.name == 'azents-runtime-runner'
        uses: ./.github/actions/expose-github-runtime
      - name: Prepare empty Next.js cache context
        run: mkdir -p /tmp/next-cache/next-cache
      - name: Build ${{ matrix.name }}
        run: |
          cache_args=()
          if [ "${{ matrix.name }}" = azents-runtime-runner ]; then
            cache_args=(
              --cache-from
              "type=gha,scope=azents-e2e-v1-azents-runtime-runner"
            )
          fi
          docker buildx build \
            --load \
            "${cache_args[@]}" \
            ${{ matrix.extra_context }} \
            -f "${{ matrix.dockerfile }}" \
            -t "${{ matrix.image }}" \
            .
      - name: Smoke ${{ matrix.name }}
        run: |
          set -euo pipefail
          case "${{ matrix.name }}" in
            azents-llm-proxy)
              docker run --rm --network none --entrypoint sh "${{ matrix.image }}" -ec \
                'test "$(id -u)" = 65532 &&
                 python -m azents_llm_proxy.audit &&
                 test -s /usr/share/doc/azents-llm-proxy/inventory.json'
              docker run --rm --network none -i --entrypoint python "${{ matrix.image }}" - \
                < python/apps/azents-llm-proxy/scripts/smoke_image.py
              ;;
            azents-runtime-runner)
              docker run --rm --entrypoint sh "${{ matrix.image }}" -ec \
                'docker --version | grep -F "Docker version 29.8.2" &&
                 docker buildx version | grep -F "github.com/docker/buildx v0.37.2" &&
                 docker compose version | grep -F "Docker Compose version v5.6.0" &&
                 test -z "${DOCKER_BUILDKIT:-}" &&
                 test -z "${COMPOSE_DOCKER_CLI_BUILD:-}" &&
                 test ! -e /var/run/azents-engine/docker.sock'
              ;;
            azents-runtime-proxy)
              docker run --rm --entrypoint sh "${{ matrix.image }}" -ec \
                'test "$(id -u)" = 1000 &&
                 test "$(id -g)" = 1000 &&
                 /workspace/python/apps/azents-runtime-proxy/.venv/bin/mitmdump \
                   --version | grep -F "Mitmproxy: 12.3.1"'
              ;;
            azents-runtime-engine)
              docker run --rm --entrypoint dockerd "${{ matrix.image }}" --version \
                | grep -F 'Docker version 29.8.2'
              ;;
          esac

      - name: Export exact E2E image
        if: >-
          (needs.changes.outputs.python_e2e == 'true' || needs.changes.outputs.web_e2e == 'true')
          && contains(fromJSON('["azents-server","azents-runtime-runner","azents-runtime-provider-docker","azents-web","azents-admin-web"]'), matrix.name)
        run: |
          python -m scripts.ci.e2e_images export \
            --image "${{ matrix.name }}" \
            --directory "${RUNNER_TEMP}/e2e-image"
      - name: Publish exact E2E image
        if: >-
          (needs.changes.outputs.python_e2e == 'true' || needs.changes.outputs.web_e2e == 'true')
          && contains(fromJSON('["azents-server","azents-runtime-runner","azents-runtime-provider-docker","azents-web","azents-admin-web"]'), matrix.name)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-e2e-image-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-image
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  ci-docker-build:
    name: ci-docker-build
    needs:
      - changes
      - ci_docker_build_run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate Docker build result
        run: |
          changes_result='${{ needs.changes.result }}'
          changed='${{ needs.changes.outputs.docker == 'true' || needs.changes.outputs.python_e2e == 'true' || needs.changes.outputs.web_e2e == 'true' }}'
          result='${{ needs.ci_docker_build_run.result }}'
          if [ "$changes_result" != 'success' ]; then
            echo "changes job failed or was skipped: $changes_result"
            exit 1
          fi
          if [ "$changed" != 'true' ]; then
            echo 'Docker scope unchanged; passing.'
            exit 0
          fi
          if [ "$result" = 'success' ]; then
            exit 0
          fi
          echo "Docker scope changed but ci-docker-build-run result was: $result"
          exit 1
